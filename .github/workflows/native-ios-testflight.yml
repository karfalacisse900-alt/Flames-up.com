name: Native iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      configure_only:
        description: Configure the Captro Scan in-app purchase without rebuilding the app
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "ios_native/MIRA/**"
      - ".github/workflows/native-ios-testflight.yml"

env:
  IOS_NATIVE_DIR: ios_native/MIRA
  BUNDLE_ID: com.captro.app
  SCHEME: Captro

jobs:
  build-testflight:
    name: Build native SwiftUI iOS app and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        if: ${{ !inputs.configure_only }}
        run: xcodebuild -version

      - name: Install XcodeGen
        if: ${{ !inputs.configure_only }}
        run: arch -arm64 brew install xcodegen

      - name: Check Rust native core
        if: ${{ !inputs.configure_only }}
        run: |
          set -euo pipefail
          RUST_CORE_DIR="${IOS_NATIVE_DIR}/rust/mira_core"
          if [ ! -f "$RUST_CORE_DIR/Cargo.toml" ]; then
            echo "::warning::Rust native core not found at $RUST_CORE_DIR. Skipping Rust build for this branch."
            exit 0
          fi
          rustup target add aarch64-apple-ios
          cargo build --manifest-path "$RUST_CORE_DIR/Cargo.toml" --release --target aarch64-apple-ios

      - name: Generate Xcode project
        if: ${{ !inputs.configure_only }}
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        run: xcodegen generate --spec project.yml

      - name: Prepare App Store Connect API key
        if: ${{ !inputs.configure_only }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Install signing certificate and provisioning profile
        if: ${{ !inputs.configure_only }}
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          KEYCHAIN_PATH="$RUNNER_TEMP/captro-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/captro.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/captro-profile.plist"

          echo -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST")

          EXPECTED_APP_ID="${APPLE_TEAM_ID}.${BUNDLE_ID}"
          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "::error::Provisioning profile targets $PROFILE_APP_ID; Captro requires $EXPECTED_APP_ID."
            exit 1
          fi
          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Provisioning profile belongs to team $PROFILE_TEAM_ID; expected $APPLE_TEAM_ID."
            exit 1
          fi

          if [ -n "$IOS_PROVISIONING_PROFILE_NAME" ]; then
            if [ "$IOS_PROVISIONING_PROFILE_NAME" != "$PROFILE_NAME" ]; then
              echo "::error::Configured profile name $IOS_PROVISIONING_PROFILE_NAME does not match embedded name $PROFILE_NAME."
              exit 1
            fi
            PROFILE_NAME="$IOS_PROVISIONING_PROFILE_NAME"
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "keychain-path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "profile-name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive native iOS app
        if: ${{ !inputs.configure_only }}
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain-path }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild \
            -project Captro.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Captro.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="1.0.1" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            clean archive

      - name: Export IPA
        if: ${{ !inputs.configure_only }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Captro.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        if: ${{ !inputs.configure_only }}
        uses: actions/upload-artifact@v7
        with:
          name: Captro-native-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ !inputs.configure_only }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH=$(find "$RUNNER_TEMP/export" -type f -name "*.ipa" | head -n 1)
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Configure Captro Scan consumable
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_BUNDLE_ID: com.captro.app
          CAPTRO_SCAN_PRODUCT_ID: com.captro.scan.credits.10
        run: node scripts/app-store/ensure-scan-iap.mjs

  home-feed-visual-qa:
    name: Capture Captro Home feed on iPhone simulator
    if: ${{ github.ref_name == 'fix-main-feed-media-sizing' }}
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios_native/MIRA

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: arch -arm64 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select iPhone simulator
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import subprocess

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          preferred = ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 15 Pro"]
          available = [device for runtime in devices.values() for device in runtime if device.get("isAvailable")]
          selected = next((device for name in preferred for device in available if device["name"] == name), None)
          if selected is None:
              selected = next((device for device in available if device["name"].startswith("iPhone")), None)
          if selected is None:
              raise SystemExit("No available iPhone simulator")
          print(f"SIMULATOR_UDID={selected['udid']}")
          print(f"SIMULATOR_NAME={selected['name']}")
          PY

      - name: Boot simulator
        shell: bash
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build Captro for simulator
        shell: bash
        run: |
          xcodebuild \
            -project Captro.xcodeproj \
            -scheme Captro \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/CaptroHomeFeedDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Install and launch visual test
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/home-feed-visual-qa"
          APP_PATH="$RUNNER_TEMP/CaptroHomeFeedDerivedData/Build/Products/Debug-iphonesimulator/Captro.app"
          mkdir -p "$OUTPUT_DIR"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl status_bar "$SIMULATOR_UDID" override \
            --time "9:41" \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4
          xcrun simctl launch \
            --terminate-running-process \
            --stdout="$OUTPUT_DIR/captro.stdout.log" \
            --stderr="$OUTPUT_DIR/captro.stderr.log" \
            "$SIMULATOR_UDID" \
            com.captro.app \
            --captro-home-feed-visual-test
          sleep 15

          xcrun simctl spawn "$SIMULATOR_UDID" log show \
            --style compact \
            --info \
            --debug \
            --last 3m \
            --predicate 'process == "Captro" OR eventMessage CONTAINS[c] "com.captro.app"' \
            > "$OUTPUT_DIR/captro-system.log" 2>&1 || true

          sleep 2
          for report_root in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/CrashReporter"; do
            if [ -d "$report_root" ]; then
              find "$report_root" -type f -mmin -10 \
                \( -iname 'Captro*.ips' -o -iname 'Captro*.crash' \) \
                -exec cp {} "$OUTPUT_DIR/" \; || true
            fi
          done

          if xcrun simctl spawn "$SIMULATOR_UDID" launchctl list | grep -Fq "com.captro.app"; then
            echo "CAPTRO_VISUAL_APP_RUNNING=true" >> "$GITHUB_ENV"
          else
            echo "CAPTRO_VISUAL_APP_RUNNING=false" >> "$GITHUB_ENV"
            echo "::error::Captro terminated before the visual QA screenshot."
          fi

      - name: Capture screenshot
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/home-feed-visual-qa"
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/home-feed-visual-qa/captro-home-feed.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/home-feed-visual-qa/captro-home-feed.png"

      - name: Verify Captro remained active
        shell: bash
        run: |
          if [ "$CAPTRO_VISUAL_APP_RUNNING" != "true" ]; then
            echo "--- Captro stderr ---"
            cat "$RUNNER_TEMP/home-feed-visual-qa/captro.stderr.log" || true
            echo "--- Captro stdout ---"
            cat "$RUNNER_TEMP/home-feed-visual-qa/captro.stdout.log" || true
            echo "--- Simulator log tail ---"
            tail -n 200 "$RUNNER_TEMP/home-feed-visual-qa/captro-system.log" || true
            exit 1
          fi

      - name: Upload screenshot and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: captro-home-feed-visual-qa
          path: ${{ runner.temp }}/home-feed-visual-qa/
          if-no-files-found: error
          retention-days: 14
