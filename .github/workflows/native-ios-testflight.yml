name: Native iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      existing_build_number:
        description: "Distribute an already uploaded build without rebuilding"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "ios_native/MIRA/**"
      - ".github/workflows/native-ios-testflight.yml"

env:
  IOS_NATIVE_DIR: ios_native/MIRA
  BUNDLE_ID: com.captro.app
  SCHEME: Captro

jobs:
  build-testflight:
    name: Build native SwiftUI iOS app and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select existing TestFlight build
        if: inputs.existing_build_number != ''
        run: echo "BUILD_NUMBER=${{ inputs.existing_build_number }}" >> "$GITHUB_ENV"

      - name: Show Xcode version
        if: inputs.existing_build_number == ''
        run: xcodebuild -version

      - name: Install XcodeGen
        if: inputs.existing_build_number == ''
        run: brew install xcodegen

      - name: Check Rust native core
        if: inputs.existing_build_number == ''
        run: |
          set -euo pipefail
          RUST_CORE_DIR="${IOS_NATIVE_DIR}/rust/mira_core"
          if [ ! -f "$RUST_CORE_DIR/Cargo.toml" ]; then
            echo "::warning::Rust native core not found at $RUST_CORE_DIR. Skipping Rust build for this branch."
            exit 0
          fi
          rustup target add aarch64-apple-ios
          cargo build --manifest-path "$RUST_CORE_DIR/Cargo.toml" --release --target aarch64-apple-ios

      - name: Generate Xcode project
        if: inputs.existing_build_number == ''
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        run: xcodegen generate --spec project.yml

      - name: Run native iOS unit tests
        if: inputs.existing_build_number == ''
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found")
          ')
          xcodebuild \
            -project Captro.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:CaptroTests \
            test

      - name: Prepare App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Install signing certificate and provisioning profile
        if: inputs.existing_build_number == ''
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          KEYCHAIN_PATH="$RUNNER_TEMP/captro-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/captro.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/captro-profile.plist"

          echo -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          if [ -n "$IOS_PROVISIONING_PROFILE_NAME" ]; then
            PROFILE_NAME="$IOS_PROVISIONING_PROFILE_NAME"
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "keychain-path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "profile-name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive native iOS app
        if: inputs.existing_build_number == ''
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain-path }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild \
            -project Captro.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Captro.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="1.0.1" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            clean archive

      - name: Export IPA
        if: inputs.existing_build_number == ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Captro.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        if: inputs.existing_build_number == ''
        uses: actions/upload-artifact@v7
        with:
          name: Captro-native-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: inputs.existing_build_number == ''
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH=$(find "$RUNNER_TEMP/export" -type f -name "*.ipa" | head -n 1)
          for attempt in 1 2 3 4; do
            if xcrun altool \
              --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "TestFlight upload failed after $attempt attempts."
              exit 1
            fi

            delay=$((attempt * 30))
            echo "App Store Connect upload failed on attempt $attempt; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Install fastlane
        run: brew install fastlane

      - name: Wait for processing and distribute to Captro Public Beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEY_JSON="$RUNNER_TEMP/app-store-connect-api-key.json"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          python3 - "$API_KEY_JSON" "$KEY_PATH" <<'PY'
          import json
          import os
          import sys

          output_path, key_path = sys.argv[1:]
          with open(key_path, "r", encoding="utf-8") as handle:
              private_key = handle.read()
          payload = {
              "key_id": os.environ["APP_STORE_CONNECT_API_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_API_ISSUER_ID"],
              "key": private_key,
              "in_house": False,
          }
          with open(output_path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          echo "TESTFLIGHT_DISTRIBUTION_STATUS=pending" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            LOG_PATH="$RUNNER_TEMP/testflight-distribution-${attempt}.log"
            set +e
            fastlane pilot distribute \
              --api_key_path "$API_KEY_JSON" \
              --app_platform ios \
              --app_identifier "$BUNDLE_ID" \
              --apple_id "6777888591" \
              --app_version "1.0.1" \
              --build_number "$BUILD_NUMBER" \
              --groups "Captro Public Beta" \
              --distribute_external true \
              --notify_external_testers false \
              --submit_beta_review false \
              --wait_processing_interval 30 \
              --wait_processing_timeout_duration 1800 \
              --changelog "Polished Yearbook browsing, responsive book spreads, clearer profiles, filters, and smoother page turns." \
              2>&1 | tee "$LOG_PATH"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo "TESTFLIGHT_DISTRIBUTION_STATUS=assigned" >> "$GITHUB_ENV"
              exit 0
            fi

            if grep -q "No build to distribute" "$LOG_PATH" && [ "$attempt" -lt 60 ]; then
              echo "Build $BUILD_NUMBER is still processing in App Store Connect; retrying in 30 seconds."
              sleep 30
              continue
            fi

            if grep -qiE "forbidden for security reasons|API key in use does not allow this request" "$LOG_PATH"; then
              echo "::warning::Captro $BUILD_NUMBER is uploaded to TestFlight, but the App Store Connect API key cannot assign it to Captro Public Beta. Assign the build to the group manually or grant the key TestFlight distribution permissions."
              echo "TESTFLIGHT_DISTRIBUTION_STATUS=manual_required" >> "$GITHUB_ENV"
              exit 0
            fi

            exit "$status"
          done

      - name: Confirm TestFlight distribution
        run: |
          case "${TESTFLIGHT_DISTRIBUTION_STATUS:-assigned}" in
            assigned)
              echo "Captro ${BUILD_NUMBER} was uploaded, processed, and assigned to Captro Public Beta."
              ;;
            manual_required)
              echo "::warning::Captro ${BUILD_NUMBER} is in TestFlight. Captro Public Beta assignment still requires App Store Connect permissions or manual assignment."
              ;;
            *)
              echo "Captro ${BUILD_NUMBER} completed with distribution status: ${TESTFLIGHT_DISTRIBUTION_STATUS:-unknown}."
              ;;
          esac
