name: Aura iOS TestFlight Distribution

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store Connect build number to distribute
        required: true
      app_version:
        description: Marketing version containing the build (check ios_native/MIRA/project.yml for the current value)
        required: true
        default: "1.0.1"
      beta_group:
        description: Internal TestFlight group (must already exist in App Store Connect)
        required: true
        default: Aura Internal Beta
      changelog:
        description: TestFlight "What to Test" changelog for this build
        required: true
        default: Aura Mobile build.

permissions:
  contents: read

env:
  APPLE_APP_ID: "6804671675"
  BUNDLE_ID: com.karfala90.aura

jobs:
  distribute-testflight:
    name: Wait for processing and distribute to testers
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install fastlane
        run: brew install fastlane

      - name: Prepare App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          API_KEY_JSON="$RUNNER_TEMP/app-store-connect-api-key.json"

          mkdir -p "$KEY_DIR"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          python3 - "$API_KEY_JSON" "$KEY_PATH" <<'PY'
          import json
          import os
          import sys

          output_path, key_path = sys.argv[1:]
          with open(key_path, "r", encoding="utf-8") as handle:
              private_key = handle.read()
          payload = {
              "key_id": os.environ["APP_STORE_CONNECT_API_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_API_ISSUER_ID"],
              "key": private_key,
              "in_house": False,
          }
          with open(output_path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          echo "API_KEY_JSON=$API_KEY_JSON" >> "$GITHUB_ENV"

      - name: Distribute processed build to TestFlight group
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_VERSION: ${{ inputs.app_version }}
          BETA_GROUP: ${{ inputs.beta_group }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          fastlane pilot distribute \
            --api_key_path "$API_KEY_JSON" \
            --app_platform ios \
            --app_identifier "$BUNDLE_ID" \
            --apple_id "$APPLE_APP_ID" \
            --app_version "$APP_VERSION" \
            --build_number "$BUILD_NUMBER" \
            --groups "$BETA_GROUP" \
            --distribute_external false \
            --notify_external_testers false \
            --submit_beta_review true \
            --wait_processing_interval 30 \
            --wait_processing_timeout_duration 1800 \
            --changelog "$CHANGELOG"

      - name: Remove temporary App Store Connect key
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          rm -f "$RUNNER_TEMP/app-store-connect-api-key.json"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
