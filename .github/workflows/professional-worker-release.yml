name: Approved professional and Tea backend rollout
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
concurrency:
  group: captro-production-reliability
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact deployed Worker, configuration and candidate scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node backend-cf/scripts/verify-professional-worker.mjs
      - name: Preserve preceding deployment source
        run: git archive --format=zip --output="$RUNNER_TEMP/preceding-worker-source.zip" 89ca332f6e47954f376aec366845468b8efa48f4 backend-cf
      - uses: actions/upload-artifact@v4
        with:
          name: preceding-professional-worker-source
          path: ${{ runner.temp }}/preceding-worker-source.zip
      - run: npm ci
        working-directory: backend-cf
      - run: npx tsc --noEmit && npm test
        working-directory: backend-cf
      - name: Verify existing security, commerce and earnings boundaries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node scripts/app-store/verify-security-schema.mjs
          node backend-cf/scripts/verify-reliability-schema.mjs
          node backend-cf/scripts/verify-creator-earnings-schema.mjs
      - name: Compile reviewed Worker
        working-directory: backend-cf
        run: npx wrangler deploy --env production --dry-run --outdir "$RUNNER_TEMP/professional-worker" --define 'CAPTRO_RELIABILITY_RELEASE_MODE:"ready"'
      - name: Require approved schema before deployment
        if: ${{ inputs.stage == 'deploy' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/app-store/verify-professional-release-schema.mjs
      - name: Deploy matching API preserving all current variables and secrets
        if: ${{ inputs.stage == 'deploy' }}
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/verify-professional-worker.mjs
          npx wrangler deploy --env production --keep-vars --message "Professional accounts and Tea $GITHUB_SHA" --define 'CAPTRO_RELIABILITY_RELEASE_MODE:"ready"'
      - name: Verify deployed source and unchanged financial configuration
        if: ${{ inputs.stage == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node backend-cf/scripts/verify-professional-worker.mjs --after
      - name: Verify existing public routes and anonymous denial
        if: ${{ inputs.stage == 'deploy' }}
        run: |
          node backend-cf/scripts/verify-tea-http.mjs
          node backend-cf/scripts/verify-feed-pagination.mjs
      - name: Verify professional ownership and review with isolated identities
        if: ${{ inputs.stage == 'deploy' }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node backend-cf/scripts/verify-professional-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professional-worker-candidate
          path: ${{ runner.temp }}/professional-worker
          if-no-files-found: ignore
