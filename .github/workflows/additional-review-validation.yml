name: Validate additional reliability repairs
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: ios_native/MIRA
      - name: Build and run hostless native regressions without credentials or distribution
        working-directory: ios_native/MIRA
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          git rev-parse HEAD
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/ReviewBuild" -resultBundlePath "$RUNNER_TEMP/Review.xcresult" \
            CODE_SIGNING_ALLOWED=NO -only-testing:CaptroStampTests test \
            2>&1 | tee "$RUNNER_TEMP/review-native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: additional-review-native-evidence
          path: |
            ${{ runner.temp }}/review-native.log
            ${{ runner.temp }}/Review.xcresult
