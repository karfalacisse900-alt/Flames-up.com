name: Validate additional reliability repairs
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: ios_native/MIRA
      - name: Build native app and regressions without credentials or distribution
        working-directory: ios_native/MIRA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          git rev-parse HEAD
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          echo "REVIEW_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl list devices available -j > "$RUNNER_TEMP/review-devices.json"
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/ReviewBuild" CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee "$RUNNER_TEMP/review-build.log"
      - name: Install explicit sample media and execute interactive regressions
        working-directory: ios_native/MIRA
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl install "$REVIEW_DEVICE" "$RUNNER_TEMP/ReviewBuild/Build/Products/Debug-iphonesimulator/Captro.app"
          container=$(xcrun simctl get_app_container "$REVIEW_DEVICE" com.captro.app data)
          mkdir -p "$container/Documents"
          curl --fail --retry 2 --max-time 60 \
            'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=max&w=900&q=85&fm=jpg' \
            -o "$container/Documents/presentation-photo.jpg"
          cp "$container/Documents/presentation-photo.jpg" "$container/Documents/presentation-photo-2.jpg"
          brew install ffmpeg
          # Synthetic local playback fixture; not camera quality or remote HLS evidence.
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=480x640:rate=30 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p \
            -c:a aac "$container/Documents/presentation-video.mp4"
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$REVIEW_DEVICE" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/ReviewBuild" -resultBundlePath "$RUNNER_TEMP/Review.xcresult" \
            CODE_SIGNING_ALLOWED=NO -only-testing:CaptroStampTests \
            -only-testing:CaptroLayoutUITests/AccountRecoveryTests \
            -only-testing:CaptroLayoutUITests/MediaRecoveryTests \
            -only-testing:CaptroLayoutUITests/FavoritesTests/testCarouselSaveDetailsUnsaveAndSavedLibraryStaySynchronized \
            -only-testing:CaptroLayoutUITests/FavoritesTests/testBareVideoCreatorOnlyInDetailsAndTopLeftControlsDoNotNavigate \
            -only-testing:CaptroLayoutUITests/WelcomeTests/testNormalWelcomeIsFixedAndEveryActionFitsWithoutScrolling test-without-building \
            2>&1 | tee "$RUNNER_TEMP/review-native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: additional-review-native-evidence
          path: |
            ${{ runner.temp }}/review-native.log
            ${{ runner.temp }}/review-build.log
            ${{ runner.temp }}/review-devices.json
            ${{ runner.temp }}/Review.xcresult
