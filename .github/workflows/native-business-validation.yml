name: Validate Captro Business
on:
  workflow_dispatch:
  push:
    branches: [feature/captro-business-ordering]
    paths:
      - '.github/workflows/native-business-validation.yml'
      - 'ios_native/MIRA/**'
permissions:
  contents: read
concurrency:
  group: captro-business-simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: ios_native/MIRA
      - name: Test native storefront and shopping bag
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Business.xcresult" \
            -only-testing:CaptroLayoutUITests/BusinessOrderingTests \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/business-simulator.log"
      - name: Export screenshots from simulator checks
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Business.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Business.xcresult" \
              --output-path "$RUNNER_TEMP/business-screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-simulator
          path: |
            ${{ runner.temp }}/Business.xcresult
            ${{ runner.temp }}/business-simulator.log
            ${{ runner.temp }}/business-screenshots
