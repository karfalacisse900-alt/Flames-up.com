name: Validate Deployed Composer Contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composer-contract:
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify real private creation, intent, audience, responses and retry
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node backend-cf/scripts/verify-composition.mjs
