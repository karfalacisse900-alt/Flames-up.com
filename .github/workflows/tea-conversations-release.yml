name: Release Tea Conversations API
on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      expected_version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
      expected_version:
        type: string
        default: ''
concurrency:
  group: captro-production-reliability
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Inspect production baseline and exact code scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DEPLOY: ${{ inputs.deploy }}
        run: node backend-cf/scripts/verify-tea-release.mjs
      - run: npm ci
        working-directory: backend-cf
      - run: npx tsc --noEmit && npm test
        working-directory: backend-cf
      - name: Verify current security and commerce boundaries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node scripts/app-store/verify-security-schema.mjs
          node backend-cf/scripts/verify-reliability-schema.mjs
          node backend-cf/scripts/verify-creator-earnings-schema.mjs
      - name: Compile Worker
        working-directory: backend-cf
        run: npx wrangler deploy --env production --dry-run --outdir "$RUNNER_TEMP/tea-worker" --define 'CAPTRO_RELIABILITY_RELEASE_MODE:"ready"'
      - name: Verify Tea schema before deployment
        if: ${{ inputs.deploy }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node backend-cf/scripts/verify-tea-schema.mjs
      - name: Deploy code while preserving current variables and secrets
        if: ${{ inputs.deploy }}
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DEPLOY: 'true'
        run: |
          node scripts/verify-tea-release.mjs
          npx wrangler deploy --env production --keep-vars --message "Tea Conversations $GITHUB_SHA" --define 'CAPTRO_RELIABILITY_RELEASE_MODE:"ready"'
      - name: Verify preserved production bindings and record deployed version
        if: ${{ inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node backend-cf/scripts/verify-tea-release.mjs --after
      - name: Verify public read and anonymous write denial
        if: ${{ inputs.deploy }}
        run: node backend-cf/scripts/verify-tea-http.mjs --require-author-photos
