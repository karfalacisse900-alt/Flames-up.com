name: Review native welcome and post controls
on:
  workflow_call:
permissions:
  contents: read
jobs:
  review:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attest the exact native sources before generation
        run: node scripts/app-store/native-validation-source.mjs
      - name: Record exact source and toolchain
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/welcome-source.txt"
          xcodebuild -version >> "$RUNNER_TEMP/welcome-source.txt"
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: ios_native/MIRA
      - name: Select small and large iPhones
        run: |
          runtime=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(r for r in json.load(sys.stdin)["devices"] if r.endswith("iOS-26-4")))')
          large=$(xcrun simctl create 'Welcome large review' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$runtime")
          small=$(xcrun simctl create 'Welcome small review' com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini "$runtime")
          echo "WELCOME_LARGE=$large" >> "$GITHUB_ENV"
          echo "WELCOME_SMALL=$small" >> "$GITHUB_ENV"
          xcrun simctl boot "$large"
          xcrun simctl bootstatus "$large" -b
          xcrun simctl status_bar "$large" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Build actual native app and tests
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$WELCOME_LARGE" \
            -derivedDataPath "$RUNNER_TEMP/WelcomeBuild" CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee "$RUNNER_TEMP/welcome-build.log"
      - name: Large iPhone welcome and existing safety unit tests
        timeout-minutes: 20
        working-directory: ios_native/MIRA
        run: |
          set -euo pipefail
          xcrun simctl install "$WELCOME_LARGE" "$RUNNER_TEMP/WelcomeBuild/Build/Products/Debug-iphonesimulator/Captro.app"
          container=$(xcrun simctl get_app_container "$WELCOME_LARGE" com.captro.app data)
          mkdir -p "$container/Documents"
          curl --fail --retry 2 --max-time 60 \
            'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=max&w=900&q=85&fm=jpg' \
            -o "$RUNNER_TEMP/presentation-photo.jpg"
          brew install ffmpeg
          # Synthetic, explicitly labeled local playback fixture, not camera evidence.
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=480x640:rate=30 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p \
            -c:a aac "$RUNNER_TEMP/presentation-video.mp4"
          cp "$RUNNER_TEMP/presentation-photo.jpg" "$container/Documents/presentation-photo.jpg"
          cp "$RUNNER_TEMP/presentation-photo.jpg" "$container/Documents/presentation-photo-2.jpg"
          cp "$RUNNER_TEMP/presentation-video.mp4" "$container/Documents/presentation-video.mp4"
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$WELCOME_LARGE" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/WelcomeBuild" -resultBundlePath "$RUNNER_TEMP/WelcomeLarge.xcresult" \
            -only-testing:CaptroStampTests -only-testing:CaptroLayoutUITests/WelcomeTests -only-testing:CaptroLayoutUITests/CreatorSupportTests \
            -only-testing:CaptroLayoutUITests/FavoritesTests \
            -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame \
            -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLazyFeedTabReturnDoesNotIssueScrollCommands \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$RUNNER_TEMP/welcome-large.log"
      - name: Small iPhone native welcome
        if: success()
        timeout-minutes: 20
        working-directory: ios_native/MIRA
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$WELCOME_LARGE"
          xcrun simctl boot "$WELCOME_SMALL"
          xcrun simctl bootstatus "$WELCOME_SMALL" -b
          xcrun simctl status_bar "$WELCOME_SMALL" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$WELCOME_SMALL" "$RUNNER_TEMP/WelcomeBuild/Build/Products/Debug-iphonesimulator/Captro.app"
          container=$(xcrun simctl get_app_container "$WELCOME_SMALL" com.captro.app data)
          mkdir -p "$container/Documents"
          cp "$RUNNER_TEMP/presentation-photo.jpg" "$container/Documents/presentation-photo.jpg"
          cp "$RUNNER_TEMP/presentation-photo.jpg" "$container/Documents/presentation-photo-2.jpg"
          cp "$RUNNER_TEMP/presentation-video.mp4" "$container/Documents/presentation-video.mp4"
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$WELCOME_SMALL" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/WelcomeBuild" -resultBundlePath "$RUNNER_TEMP/WelcomeSmall.xcresult" \
            -only-testing:CaptroLayoutUITests/WelcomeTests -only-testing:CaptroLayoutUITests/CreatorSupportTests -only-testing:CaptroLayoutUITests/FavoritesTests \
            -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame \
            CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/welcome-small.log"
      - name: Capture the native artwork reveal and settled composition
        if: success()
        run: |
          app="$RUNNER_TEMP/WelcomeBuild/Build/Products/Debug-iphonesimulator/Captro.app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl terminate "$WELCOME_SMALL" "$bundle" || true
          xcrun simctl io "$WELCOME_SMALL" recordVideo --codec=h264 "$RUNNER_TEMP/welcome-native-reveal.mp4" &
          recording=$!
          xcrun simctl launch "$WELCOME_SMALL" "$bundle" --captro-welcome-review
          # Cold simulator launch can consume several seconds before the
          # 600ms + 8s artwork motion starts. This is capture duration only.
          sleep 20
          kill -INT "$recording"
          wait "$recording" || true
          xcrun simctl io "$WELCOME_SMALL" screenshot "$RUNNER_TEMP/welcome-native-settled.png"
      - name: Export actual implementation screenshots and test results
        if: always()
        run: |
          for name in WelcomeLarge WelcomeSmall; do
            if [ -d "$RUNNER_TEMP/$name.xcresult" ]; then
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$name.xcresult" --output-path "$RUNNER_TEMP/$name-evidence" || true
              xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$name.xcresult" > "$RUNNER_TEMP/$name-summary.json" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-validation-source
          path: ${{ runner.temp }}/native-validation-source/source.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-welcome-native-review
          path: |
            ${{ runner.temp }}/welcome-source.txt
            ${{ runner.temp }}/welcome-*.log
            ${{ runner.temp }}/welcome-native-reveal.mp4
            ${{ runner.temp }}/welcome-native-settled.png
            ${{ runner.temp }}/Welcome*-evidence/
            ${{ runner.temp }}/Welcome*-summary.json
