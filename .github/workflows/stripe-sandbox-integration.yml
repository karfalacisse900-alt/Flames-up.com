name: Stripe Sandbox Integration
on:
  workflow_dispatch:
  push:
    branches: [fix/oauth-guest-access]
    paths:
      - '.github/workflows/stripe-sandbox-integration.yml'
      - 'backend-cf/scripts/stripe-sandbox-*.mjs'
permissions:
  contents: read
concurrency:
  group: captro-stripe-sandbox-integration
  cancel-in-progress: false
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: captro-payments-test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: npm ci
        working-directory: backend-cf
      - name: Read the deployed schema without copying any production data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase db dump --project-ref "$SUPABASE_PROJECT_REF" --schema public,private --file "$RUNNER_TEMP/captro-schema.sql"
      - name: Start an ephemeral local database, never a linked project
        run: |
          mkdir "$RUNNER_TEMP/captro-sandbox"
          supabase init --workdir "$RUNNER_TEMP/captro-sandbox"
          supabase migration new deployed_schema_and_native_payments --workdir "$RUNNER_TEMP/captro-sandbox"
          node backend-cf/scripts/stripe-sandbox-schema.mjs
          supabase start --workdir "$RUNNER_TEMP/captro-sandbox" --exclude studio,postgres-meta,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,mailpit > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            grep -E 'ERROR:|failed|unhealthy' "$RUNNER_TEMP/supabase-start.log" | head -n 10
            exit 1
          }
          supabase status --workdir "$RUNNER_TEMP/captro-sandbox" -o json > "$RUNNER_TEMP/supabase-status.json"
      - name: Verify isolated runtime and sandbox credentials
        working-directory: backend-cf
        env:
          STRIPE_MODE: ${{ vars.STRIPE_MODE }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: node scripts/stripe-sandbox-bootstrap.mjs
      - name: Install pinned Stripe webhook forwarding CLI
        run: npm install --global @stripe/cli@1.50.10
      - name: Exercise Captro auth and Connect against the real sandbox
        working-directory: backend-cf
        env:
          STRIPE_MODE: ${{ vars.STRIPE_MODE }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: node scripts/stripe-sandbox-runtime.mjs
      - name: Stop only this runner's disposable stack
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/captro-sandbox" --no-backup
