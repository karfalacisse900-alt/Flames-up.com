name: Validate Native Capture
on:
  workflow_dispatch:
    inputs:
      contract_only:
        description: Verify deployed composer using disposable accounts and private posts only
        type: boolean
        default: false
  push:
    branches: [feature/recorded-voice-moderation]
    paths:
      - 'ios_native/MIRA/**'
      - '.github/workflows/native-capture-validation.yml'
permissions:
  contents: read
jobs:
  capture:
    if: ${{ inputs.contract_only != true }}
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: ios_native/MIRA
      - name: Build and test Capture and creation
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/CaptureBuild" -resultBundlePath "$RUNNER_TEMP/Capture.xcresult" \
            -only-testing:CaptroLayoutUITests/DesignQualityTests/testCaptureHubHasThreeClearModes \
            -only-testing:CaptroLayoutUITests/ComposerCreationTests \
            -only-testing:CaptroLayoutUITests/AppSystemUITests \
            -only-testing:CaptroLayoutUITests/DesignQualityTests/testControlsAndSheetScrolling \
            -only-testing:CaptroStampTests/CaptroCompositionTests \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/capture-build.log"
      - name: Test creation on a smaller iPhone
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import sys,json; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r.get("name", "").startswith("iOS")))')"
          device="$(xcrun simctl create 'Captro Small iPhone' com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$runtime")"
          echo "CAPTRO_SMALL_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/CaptureBuild" -resultBundlePath "$RUNNER_TEMP/SmallComposer.xcresult" \
            -only-testing:CaptroLayoutUITests/ComposerCreationTests \
            -only-testing:CaptroLayoutUITests/AppSystemUITests \
            -only-testing:CaptroLayoutUITests/DesignQualityTests/testControlsAndSheetScrolling \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$RUNNER_TEMP/small-composer-test.log"
      - name: Record native composer interactions
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$CAPTRO_SMALL_SIMULATOR" -b
          xcrun simctl io "$CAPTRO_SMALL_SIMULATOR" recordVideo --codec=h264 "$RUNNER_TEMP/composer-interactions.mp4" > "$RUNNER_TEMP/composer-recording.log" 2>&1 &
          capture_pid=$!
          trap 'kill -INT "$capture_pid" 2>/dev/null || true; wait "$capture_pid" || true' EXIT
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$CAPTRO_SMALL_SIMULATOR" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/CaptureBuild" -resultBundlePath "$RUNNER_TEMP/ComposerRecording.xcresult" \
            -only-testing:CaptroLayoutUITests/ComposerCreationTests/testCompactSelectorsAndDirectTimeEditorPreserveDraft \
            -only-testing:CaptroLayoutUITests/ComposerCreationTests/testLocationUsesLiveMapsSearchAndKeyboard \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$RUNNER_TEMP/composer-recording-test.log"
      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Capture.xcresult" --output-path "$RUNNER_TEMP/capture-screenshots"
          if [ -d "$RUNNER_TEMP/SmallComposer.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/SmallComposer.xcresult" --output-path "$RUNNER_TEMP/small-composer-screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captro-capture-validation
          path: |
            ${{ runner.temp }}/capture-build.log
            ${{ runner.temp }}/small-composer-test.log
            ${{ runner.temp }}/capture-screenshots/
            ${{ runner.temp }}/small-composer-screenshots/
            ${{ runner.temp }}/composer-interactions.mp4
            ${{ runner.temp }}/composer-recording.log
            ${{ runner.temp }}/composer-recording-test.log
  composer-contract:
    if: ${{ inputs.contract_only == true }}
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify real private creation, intent, audience, responses and retry
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node backend-cf/scripts/verify-composition.mjs
