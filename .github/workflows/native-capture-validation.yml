name: Validate Native Capture
on:
  workflow_dispatch:
  push:
    branches: [feature/recorded-voice-moderation]
    paths:
      - 'ios_native/MIRA/**'
      - '.github/workflows/native-capture-validation.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: ios_native/MIRA
      - name: Build and test Capture and creation
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/CaptureBuild" -resultBundlePath "$RUNNER_TEMP/Capture.xcresult" \
            -only-testing:CaptroLayoutUITests/DesignQualityTests/testCaptureHubHasThreeClearModes \
            -only-testing:CaptroLayoutUITests/ComposerCreationTests \
            -only-testing:CaptroStampTests/CaptroCompositionTests \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/capture-build.log"
      - name: Test creation on a smaller iPhone
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import sys,json; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r.get("name", "").startswith("iOS")))')"
          device="$(xcrun simctl create 'Captro Small iPhone' com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$runtime")"
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/CaptureBuild" -resultBundlePath "$RUNNER_TEMP/SmallComposer.xcresult" \
            -only-testing:CaptroLayoutUITests/ComposerCreationTests \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$RUNNER_TEMP/small-composer-test.log"
      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Capture.xcresult" --output-path "$RUNNER_TEMP/capture-screenshots"
          if [ -d "$RUNNER_TEMP/SmallComposer.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/SmallComposer.xcresult" --output-path "$RUNNER_TEMP/small-composer-screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captro-capture-validation
          path: |
            ${{ runner.temp }}/capture-build.log
            ${{ runner.temp }}/small-composer-test.log
            ${{ runner.temp }}/capture-screenshots/
            ${{ runner.temp }}/small-composer-screenshots/
