name: Deploy Captro Site

on:
  push:
    branches:
      - main
      - codex/supabase-primary-architecture
    paths:
      - "captro-site/**"
      - ".github/workflows/captro-site-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Cloudflare Pages
        working-directory: ./captro-site
        run: npx wrangler pages deploy . --project-name captro-site --branch production
