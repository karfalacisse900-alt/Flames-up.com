name: Deploy Captro Site
on:
  push:
    branches: [main, codex/supabase-primary-architecture]
    paths: ["captro-site/**", ".github/workflows/captro-site-deploy.yml"]
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: Inspect recovery configuration only, or deploy the approved page and repair only its redirect/template
        type: choice
        options: [none, inspect, repair]
        default: none
permissions:
  contents: read
concurrency:
  group: captro-public-site-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify recovery behavior and narrow handler
        run: node --test scripts/recovery/recovery.test.mjs
      - name: Inspect current recovery configuration (read only)
        if: inputs.recovery_mode == 'inspect'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/recovery/recovery-config.mjs
      - name: Deploy existing Captro site project
        if: inputs.recovery_mode != 'inspect'
        working-directory: captro-site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.147.0 pages deploy . --project-name captro-site --branch production
      - name: Apply and verify approved recovery redirect repair
        if: inputs.recovery_mode == 'repair'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/recovery/recovery-config.mjs --apply
      - name: Retain narrowly scoped rollback values (no credentials)
        if: always() && inputs.recovery_mode == 'repair'
        uses: actions/upload-artifact@v4
        with:
          name: recovery-redirect-rollback
          path: recovery-redirect-backup.json
          if-no-files-found: ignore
          retention-days: 7
