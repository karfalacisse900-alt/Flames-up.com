name: Deploy Admin Web

on:
  push:
    branches:
      - main
      - codex/supabase-primary-architecture
    paths:
      - "admin-web/**"
      - ".github/workflows/admin-web-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_CAPTRO_API_BASE: https://api.flames-up.com/api
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        working-directory: ./admin-web
        run: npm ci

      - name: Build admin web
        working-directory: ./admin-web
        run: npm run build

      - name: Resolve the existing Pages production branch
        id: pages-project
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/pages/projects/captro-admin',{
            headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(30000)
          });
          const result=await response.json();
          const branch=result.result?.production_branch;
          if(!response.ok||!result.success||typeof branch!=='string'||! /^[A-Za-z0-9/_.-]+$/.test(branch)) throw Error('Could not verify the existing Pages production branch: HTTP '+response.status);
          appendFileSync(process.env.GITHUB_OUTPUT,'branch='+branch+'\n');
          console.log('Deploying existing Captro admin production branch: '+branch);
          JS

      - name: Deploy to Cloudflare Pages
        working-directory: ./admin-web
        run: npx wrangler pages deploy dist --project-name captro-admin --branch "${{ steps.pages-project.outputs.branch }}"
