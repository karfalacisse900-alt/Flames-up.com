name: Deploy Captro reliability update

# Manual and scoped: unlike the full release workflow, this never rotates
# payment secrets, provisions webhooks, or uploads an iOS release.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply the additive chat migration and deploy the Worker after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: captro-reliability-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: v2.106.0
      - run: npm ci
        working-directory: backend-cf
      - run: npx tsc --noEmit
        working-directory: backend-cf
      - run: npm test
        working-directory: backend-cf
      - name: Verify the only pending migration is the additive chat publication
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --dry-run --skip-vault > "$RUNNER_TEMP/pending-migrations.txt" 2>&1
          cat "$RUNNER_TEMP/pending-migrations.txt"
          python3 - <<'PY'
          import os, pathlib, re
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'pending-migrations.txt').read_text()
          pending = set(re.findall(r'\b\d{14}_[\w-]+\.sql\b', output))
          expected = {'20260924131730_captro_chat_realtime.sql'}
          if pending - expected:
              raise SystemExit(f'Unexpected pending migrations: {sorted(pending - expected)}')
          if not pending and not any(message in output for message in ('No migrations to apply', 'Remote database is up to date')):
              raise SystemExit('Could not verify remote migration state; refusing deployment')
          print('Pending migration scope is safe:', ', '.join(sorted(pending)) or 'already applied')
          PY
      - name: Verify Cloudflare access and Worker bundle without deploying
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler r2 bucket info flames-up-media-backup --json > "$RUNNER_TEMP/captro-r2-bucket.json"
          echo 'Captro private media bucket access validated'
          npx wrangler deploy --env production --dry-run --outdir "$RUNNER_TEMP/captro-worker-bundle"
      - name: Apply only the validated additive migration
        if: ${{ inputs.deploy == true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db push --linked --skip-vault
      - name: Deploy Worker without changing payment secrets or webhooks
        if: ${{ inputs.deploy == true }}
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --keep-vars
      - name: Confirm authenticated voice, status and chat routes exist
        if: ${{ inputs.deploy == true }}
        run: |
          set -euo pipefail
          base='https://flames-up-api.karfalacisse900.workers.dev/api'
          for path in chat/realtime-config voice/not-a-real-recording/status statuses; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/$path")"
            if [ "$status" != 401 ]; then
              echo "Authenticated route $path returned HTTP $status, expected 401 without a session"
              exit 1
            fi
          done
