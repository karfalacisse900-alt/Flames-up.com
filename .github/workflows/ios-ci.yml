name: Aura iOS CI

on:
  pull_request:
    paths:
      - "ios_native/MIRA/**"
      - ".github/workflows/ios-ci.yml"
  push:
    paths:
      - "ios_native/MIRA/**"
      - ".github/workflows/ios-ci.yml"

env:
  IOS_NATIVE_DIR: ios_native/MIRA
  SCHEME: Aura

jobs:
  build-and-test:
    name: Build and test (no signing, no TestFlight upload)
    runs-on: macos-26
    # Clean macOS runners compile three Rust Apple targets plus Debug/Release Swift builds.
    # The device linkage audit added for TestFlight safety must be allowed to finish.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Rust native core for iOS device and Simulator
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        run: |
          bash ./scripts/build-rust-ios.sh iphoneos
          bash ./scripts/build-rust-ios.sh iphonesimulator

      - name: Generate Xcode project
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        run: |
          xcodebuild \
            -project Aura.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found")
          ')
          xcodebuild \
            -project Aura.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:AuraTests \
            test

      - name: Launch Aura Release build in iOS Simulator
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        run: bash ./scripts/smoke-test-ios-launch.sh

      - name: Build and audit unsigned Aura Release for iPhone
        working-directory: ${{ env.IOS_NATIVE_DIR }}
        run: |
          set -euo pipefail
          DEVICE_DERIVED_DATA="$RUNNER_TEMP/aura-device-release"
          xcodebuild \
            -project Aura.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DEVICE_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
          DEVICE_APP=$(find "$DEVICE_DERIVED_DATA/Build/Products" -type d -path "*Release-iphoneos/Aura.app" -print -quit)
          test -n "$DEVICE_APP"
          bash ./scripts/audit-ios-binary-linkage.sh "$DEVICE_APP/Aura" arm64
