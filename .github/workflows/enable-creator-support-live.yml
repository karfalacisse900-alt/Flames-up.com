name: Enable guarded Captro Creator Support live checkout

on:
  workflow_dispatch:
    inputs:
      confirm_live_enablement:
        description: Enable the live server gate; creator payout readiness and admin approval remain required
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: captro-creator-support-live
  cancel-in-progress: false

jobs:
  enable-live-support:
    if: ${{ inputs.confirm_live_enablement == true }}
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - run: npm ci
        working-directory: backend-cf
      - name: Verify Worker code and payment regression suite
        working-directory: backend-cf
        run: npx tsc --noEmit && npm test
      - name: Verify live database security and finance contracts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node scripts/app-store/verify-security-schema.mjs
          node backend-cf/scripts/verify-reliability-schema.mjs
          node backend-cf/scripts/verify-creator-earnings-schema.mjs
      - name: Verify Stripe platform, webhook, and any existing approved recipients without charging
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || secrets.SECRETKEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          stripe_key = os.environ['STRIPE_SECRET_KEY']
          assert stripe_key.startswith(('sk_live_', 'rk_live_')), 'Live Stripe key is not configured'
          def stripe(path):
              req = urllib.request.Request('https://api.stripe.com/v1/' + path, headers={'Authorization': 'Bearer ' + stripe_key})
              with urllib.request.urlopen(req, timeout=25) as response: return json.load(response)
          def supabase(path):
              project = os.environ['SUPABASE_PROJECT_REF']
              key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
              req = urllib.request.Request(f'https://{project}.supabase.co/rest/v1/{path}', headers={'apikey': key, 'Authorization': 'Bearer ' + key})
              with urllib.request.urlopen(req, timeout=25) as response: return json.load(response)
          def cloudflare(path):
              account = os.environ['CLOUDFLARE_ACCOUNT_ID']
              url = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/flames-up-api{path}'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
              with urllib.request.urlopen(req, timeout=25) as response:
                  body = json.load(response)
              if body.get('success') is not True: raise SystemExit('Cloudflare production preflight failed')
              return body['result']
          platform = stripe('account')
          assert platform.get('livemode') is True and platform.get('charges_enabled') is True and platform.get('payouts_enabled') is True, 'Captro live Stripe platform is not payment-ready'
          assert (platform.get('capabilities') or {}).get('transfers') == 'active', 'Captro Stripe transfer capability is not active'
          assert (((platform.get('settings') or {}).get('payouts') or {}).get('schedule') or {}).get('interval') == 'manual', 'Captro platform payout hold is not manual'
          required_events = {'checkout.session.completed','checkout.session.async_payment_succeeded','checkout.session.async_payment_failed','charge.refunded','refund.updated','charge.dispute.created','charge.dispute.closed','account.updated','account.application.deauthorized','payout.paid','payout.failed'}
          hooks = stripe('webhook_endpoints?limit=100').get('data', [])
          candidates = [hook for hook in hooks if hook.get('status') == 'enabled' and hook.get('livemode') is True and ('flames-up-api.karfalacisse900.workers.dev' in hook.get('url','') or 'api.flames-up.com' in hook.get('url',''))]
          assert candidates and any(required_events.issubset(set(hook.get('enabled_events') or [])) for hook in candidates), 'Live Stripe webhook is not wired for payment, refund, dispute, Connect, and payout events'
          live_rows = supabase('app_connected_accounts?stripe_mode=eq.live&select=app_user_id,provider_account_id,status,charges_enabled,transfers_enabled,payouts_enabled,details_submitted,eligible_debit_card_exists,payout_schedule')
          approved = supabase('app_creator_support_enrollments?enabled_for_live=eq.true&select=creator_id')
          by_creator = {str(row.get('app_user_id')): row for row in live_rows}
          for enrollment in approved:
              row = by_creator.get(str(enrollment.get('creator_id')))
              assert row and row.get('status') == 'active' and row.get('provider_account_id','').startswith('acct_'), 'An approved creator has no active existing Stripe account'
              assert row.get('charges_enabled') is True and row.get('transfers_enabled') is True and row.get('payouts_enabled') is True and row.get('details_submitted') is True and row.get('eligible_debit_card_exists') is True and row.get('payout_schedule') == 'manual', 'An approved creator no longer meets Captro payout requirements'
              account = stripe('accounts/' + urllib.parse.quote(row['provider_account_id'], safe=''))
              assert account.get('livemode') is True and account.get('details_submitted') is True and account.get('payouts_enabled') is True and (account.get('capabilities') or {}).get('transfers') == 'active', 'Stripe no longer verifies an approved creator for transfers and payouts'
              assert ((((account.get('settings') or {}).get('payouts') or {}).get('schedule') or {}).get('interval') == 'manual'), 'An approved creator payout schedule is not manual'
          settings = cloudflare('/settings')
          support_bindings = [binding for binding in (settings.get('bindings') or []) if binding.get('name') == 'CAPTRO_CREATOR_SUPPORT']
          assert len(support_bindings) <= 1 and not any(binding.get('type') == 'secret_text' for binding in support_bindings), 'Support gate has an unexpected secret binding; no deployment made'
          versions = cloudflare('/deployments').get('deployments', [])
          active = versions[0].get('versions', []) if versions else []
          assert len(active) == 1 and active[0].get('version_id') == '20e5ada3-a21b-46eb-9ee6-407048fa0da9' and active[0].get('percentage') == 100, 'Production Worker changed since the reviewed Support baseline; no deployment made'
          print(json.dumps({'platform_ready': True, 'webhook_ready': True, 'approved_live_creators_verified': len(approved), 'unapproved_live_accounts_not_enabled': len(live_rows) - len(approved), 'worker_baseline_verified': True, 'no_payment_created': True}))
          PY
      - name: Enable only the server-side live Support gate
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --keep-vars --var 'CAPTRO_CREATOR_SUPPORT:live' --define 'CAPTRO_RELIABILITY_RELEASE_MODE:"ready"'
      - name: Verify live gate is active without creating a checkout
        run: |
          node --input-type=module <<'JS'
          const health = await fetch('https://flames-up-api.karfalacisse900.workers.dev/api/health', {signal: AbortSignal.timeout(20000)});
          if (!health.ok) throw new Error('Production API health check failed after Support gate deployment');
          const response = await fetch('https://flames-up-api.karfalacisse900.workers.dev/api/creator-support/web/checkout', {
            method:'POST', headers:{'Content-Type':'application/json',Origin:'https://captro-site.pages.dev'}, body:'{}', signal:AbortSignal.timeout(20000)
          });
          const body = await response.json().catch(() => ({}));
          if (response.status < 400 || (response.status === 503 && body.code === 'CAPTRO_SUPPORT_UNAVAILABLE')) throw new Error('Support gate verification failed or accepted an unauthenticated checkout');
          console.log(JSON.stringify({apiHealthy:true,liveGateNotDisabled:true,anonymousCheckoutDenied:true,paymentCreated:false}));
          JS