name: Release scoped Profile backend
on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
jobs:
  profile:
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: 130bdc53336d9af6cc8d8bf14c669fb22eb5efa6
          path: release
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
        working-directory: candidate/backend-cf
      - name: Verify current production baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/flames-up-api/deployments`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Deployment lookup HTTP '+r.status);
          const data=await r.json();const versions=data.result?.deployments?.[0]?.versions;
          if(versions?.length!==1||versions[0].version_id!=='54cb6650-e0dc-43df-9a4c-7a2ea5a4b00b'||versions[0].percentage!==100)throw Error('Production version changed; review baseline before deployment.');
          console.log('Verified production baseline 54cb6650-e0dc-43df-9a4c-7a2ea5a4b00b');
          JS
      - name: Prepare only reviewed profile functions and routes
        run: |
          node candidate/backend-cf/scripts/prepare-profile-worker.mjs candidate/backend-cf/src/index.ts release/backend-cf/src/index.ts
          cp candidate/backend-cf/tests/profile-privacy.test.mjs release/backend-cf/tests/profile-privacy.test.mjs
          cp candidate/supabase/migrations/20261018224210_profile_privacy_showcase.sql release/supabase/migrations/
      - run: npm ci
        working-directory: release/backend-cf
      - run: npx tsc --noEmit && npm test
        working-directory: release/backend-cf
      - name: Verify deployed security and profile RPC permissions
        if: ${{ inputs.deploy }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node candidate/scripts/app-store/verify-security-schema.mjs
      - name: Deploy only the scoped Worker artifact
        if: ${{ inputs.deploy }}
        working-directory: release/backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --keep-vars
      - name: Verify existing public feed
        if: ${{ inputs.deploy }}
        run: node candidate/backend-cf/scripts/verify-feed-pagination.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-worker-scoped-source
          path: release/backend-cf/src/index.ts
