name: Release default-off creator support API
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the default-off Support and creator-earnings API after all production checks pass
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
concurrency:
  group: captro-production-reliability
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend-cf
      - run: npx tsc --noEmit && npm test
        working-directory: backend-cf
      - name: Verify exact code scope, deployed version and disabled support
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node backend-cf/scripts/verify-support-release.mjs
      - name: Verify existing production schema without changing it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node scripts/app-store/verify-security-schema.mjs
          node backend-cf/scripts/verify-reliability-schema.mjs
          node backend-cf/scripts/verify-creator-earnings-schema.mjs
      - name: Compile only the default-off Worker
        working-directory: backend-cf
        run: npx wrangler deploy --env production --dry-run --outdir "$RUNNER_TEMP/support-worker" --define 'CAPTRO_RELIABILITY_RELEASE_MODE:"ready"'
      - name: Deploy code without changing any existing variables or secrets
        if: ${{ inputs.deploy }}
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --keep-vars --define 'CAPTRO_RELIABILITY_RELEASE_MODE:"ready"'
      - name: Verify real API availability, anonymous denial and disabled payment creation
        if: ${{ inputs.deploy }}
        run: |
          node backend-cf/scripts/verify-feed-pagination.mjs
          node backend-cf/scripts/verify-reliability-http.mjs
          node --input-type=module <<'JS'
          // Test the endpoint used by the native app and Support website. A
          // separate custom-domain edge challenge is not an application 503.
          for(const path of ['session','checkout','status']) {
            const r=await fetch('https://flames-up-api.karfalacisse900.workers.dev/api/creator-support/web/'+path, {
              method:'POST',headers:{'Content-Type':'application/json',Origin:'https://captro-site.pages.dev'},body:'{}',signal:AbortSignal.timeout(20000)
            });
            const b=await r.json();
            const statusRead=path==='status';
            const expectedStatus=statusRead?401:503;
            const expectedCode=statusRead?'CAPTRO_SUPPORT_LINK_EXPIRED':'CAPTRO_SUPPORT_UNAVAILABLE';
            if(r.status!==expectedStatus||b.code!==expectedCode)throw Error('Unexpected guarded Support response: '+path);
            console.log('PASS '+(statusRead?'protected receipt read':'disabled support creation')+' '+path);
          }
          JS
