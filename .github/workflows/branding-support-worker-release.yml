name: Release default-off creator support API
on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
concurrency:
  group: captro-production-reliability
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend-cf
      - run: npx tsc --noEmit && npm test
        working-directory: backend-cf
      - name: Verify exact code scope, deployed version and disabled support
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node backend-cf/scripts/verify-support-release.mjs
      - name: Verify existing production schema without changing it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node scripts/app-store/verify-security-schema.mjs
          node backend-cf/scripts/verify-reliability-schema.mjs
      - name: Compile only the default-off Worker
        working-directory: backend-cf
        run: npx wrangler deploy --env production --dry-run --outdir "$RUNNER_TEMP/support-worker" --define 'CAPTRO_RELIABILITY_RELEASE_MODE:"ready"'
      - name: Deploy code without changing any existing variables or secrets
        if: ${{ inputs.deploy }}
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --keep-vars --define 'CAPTRO_RELIABILITY_RELEASE_MODE:"ready"'
      - name: Verify real API availability, anonymous denial and disabled payment creation
        if: ${{ inputs.deploy }}
        run: |
          node backend-cf/scripts/verify-feed-pagination.mjs
          node backend-cf/scripts/verify-reliability-http.mjs
          node --input-type=module <<'JS'
          for(const path of ['session','checkout','status']) {
            const r=await fetch('https://api.flames-up.com/api/creator-support/web/'+path, {
              method:'POST',headers:{'Content-Type':'application/json',Origin:'https://captro-site.pages.dev'},body:'{}',signal:AbortSignal.timeout(20000)
            });
            const b=await r.json();
            if(r.status!==503||b.code!=='CAPTRO_SUPPORT_UNAVAILABLE')throw Error('Support must remain disabled: '+path);
            console.log('PASS disabled support '+path);
          }
          JS
