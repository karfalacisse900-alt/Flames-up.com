name: Deploy Captro API
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated stamp-only update
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: captro-payments-live
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify narrow release scope
        run: |
          git fetch origin af5bdc3e06a71bb9b8fa4e491d89a0d703000027
          git diff --name-only af5bdc3e06a71bb9b8fa4e491d89a0d703000027 HEAD > /tmp/changed
          if grep -Ev '^(backend-cf/src/(index|commerce|stamp-style)\.ts|backend-cf/tests/(stamp-release|stripe_native_release)\.test\.mjs|\.github/workflows/deploy-worker\.yml)$' /tmp/changed; then exit 1; fi
      - run: npm ci
        working-directory: backend-cf
      - run: npx tsc --noEmit
        working-directory: backend-cf
      - run: node --experimental-strip-types --test tests/*.test.mjs
        working-directory: backend-cf
      - name: Read deployed version history
        working-directory: backend-cf
        run: npx wrangler deployments list --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy stamp code without migrations or secret changes
        if: ${{ inputs.deploy }}
        working-directory: backend-cf
        run: npx wrangler deploy --env production --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Read public API identity
        if: ${{ inputs.deploy }}
        run: curl --fail --silent --show-error https://api.flames-up.com/
