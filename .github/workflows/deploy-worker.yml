name: Deploy Captro API

on:
  push:
    branches: [main]
    paths: ["backend-cf/**", "supabase/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json

      - name: Install dependencies
        working-directory: ./backend-cf
        run: npm ci

      - name: Type-check backend-cf
        working-directory: ./backend-cf
        run: npx tsc --noEmit

      - name: Test backend media and feed contracts
        working-directory: ./backend-cf
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Verify Cloudflare photo and video uploads
        working-directory: ./backend-cf
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MEDIA_API_TOKEN: ${{ secrets.CLOUDFLARE_MEDIA_API_TOKEN }}
          CLOUDFLARE_IMAGES_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_TOKEN }}
          CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, tomllib
          with open('wrangler.toml', 'rb') as config_file:
              config = tomllib.load(config_file)
          assert os.environ['CLOUDFLARE_ACCOUNT_ID'] == config['env']['production']['vars']['CLOUDFLARE_ACCOUNT_ID'], 'Release media account differs from the production Worker account'
          print('Release media account matches the production Worker account.')
          PY
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          node scripts/verify-post-media.mjs

      - name: Check required Supabase production secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OAUTH_FALLBACK_SECRET: ${{ secrets.OAUTH_FALLBACK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is required because Supabase Postgres is Captro's production database."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "SUPABASE_PROJECT_REF is required because Supabase Postgres is Captro's production database."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is required as a Cloudflare Worker secret for server-side database writes."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "SUPABASE_ANON_KEY is required for real Supabase session creation."
            exit 1
          fi
          if [ -z "${OAUTH_FALLBACK_SECRET:-}" ]; then
            echo "OAUTH_FALLBACK_SECRET is required for Apple and Google Supabase sessions."
            exit 1
          fi

      - name: Verify production social-auth providers
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          request = urllib.request.Request(
              f"https://{project_ref}.supabase.co/auth/v1/settings",
              headers={"apikey": service_key},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              settings = json.load(response)
          external = settings.get("external", {})
          missing = [provider for provider in ("google", "apple") if external.get(provider) is not True]
          if missing:
              raise SystemExit(f"Supabase social-auth provider disabled: {', '.join(missing)}")
          if settings.get("disable_signup") is True:
              raise SystemExit("Supabase account signup is disabled")
          print("Supabase Google and Apple providers are enabled; account signup is enabled.")
          PY

      - name: Verify production Supabase session lifecycle
        shell: bash
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import secrets
          import urllib.error
          import urllib.request
          import uuid

          base = f"https://{os.environ['SUPABASE_PROJECT_REF']}.supabase.co/auth/v1"
          anon_key = os.environ["SUPABASE_ANON_KEY"]
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          email = f"captro-auth-smoke-{uuid.uuid4().hex}@captro.invalid"
          password = secrets.token_urlsafe(48)
          user_id = None

          def request_json(url, method="GET", headers=None, body=None):
              request = urllib.request.Request(
                  url,
                  method=method,
                  headers=headers or {},
                  data=json.dumps(body).encode() if body is not None else None,
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Supabase session smoke test failed at {method} {url.rsplit('/', 1)[-1]} with HTTP {error.code}")

          admin_headers = {
              "apikey": service_key,
              "Authorization": f"Bearer {service_key}",
              "Content-Type": "application/json",
          }
          public_headers = {
              "apikey": anon_key,
              "Content-Type": "application/json",
          }

          try:
              _, created = request_json(
                  f"{base}/admin/users",
                  method="POST",
                  headers=admin_headers,
                  body={"email": email, "password": password, "email_confirm": True},
              )
              user_id = created.get("id") or created.get("user", {}).get("id")
              if not user_id:
                  raise SystemExit("Supabase session smoke test did not create an auth user")

              _, session = request_json(
                  f"{base}/token?grant_type=password",
                  method="POST",
                  headers=public_headers,
                  body={"email": email, "password": password},
              )
              access_token = session.get("access_token")
              refresh_token = session.get("refresh_token")
              if not access_token or not refresh_token:
                  raise SystemExit("Supabase session smoke test did not return access and refresh tokens")

              _, current = request_json(
                  f"{base}/user",
                  headers={"apikey": anon_key, "Authorization": f"Bearer {access_token}"},
              )
              if current.get("id") != user_id:
                  raise SystemExit("Supabase session smoke test returned the wrong user")
              print("Supabase admin creation, password exchange, access token, and refresh token validated.")
          finally:
              if user_id:
                  request_json(f"{base}/admin/users/{user_id}", method="DELETE", headers=admin_headers)
          PY

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.106.0

      - name: Push Supabase Postgres migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --include-all

      - name: Sync Supabase service-role Worker secret
        working-directory: ./backend-cf
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Sync OAuth session-bridge Worker secret
        working-directory: ./backend-cf
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OAUTH_FALLBACK_SECRET" | npx wrangler secret put OAUTH_FALLBACK_SECRET --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_FALLBACK_SECRET: ${{ secrets.OAUTH_FALLBACK_SECRET }}

      - name: Sync Scan verification provider secrets
        working-directory: ./backend-cf
        shell: bash
        run: |
          set -euo pipefail
          for name in VERYFI_CLIENT_ID VERYFI_CLIENT_SECRET VERYFI_USERNAME VERYFI_API_KEY; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name is required for Captro Scan verification."
              exit 1
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --env production
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERYFI_CLIENT_ID: ${{ secrets.VERYFI_CLIENT_ID }}
          VERYFI_CLIENT_SECRET: ${{ secrets.VERYFI_CLIENT_SECRET }}
          VERYFI_USERNAME: ${{ secrets.VERYFI_USERNAME }}
          VERYFI_API_KEY: ${{ secrets.VERYFI_API_KEY }}

      - name: Sync App Store server verification secrets
        working-directory: ./backend-cf
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name is required for StoreKit credit verification."
              exit 1
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --env production
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Sync Cloudflare media runtime secrets
        working-directory: ./backend-cf
        shell: bash
        run: |
          set -euo pipefail
          IMAGES_TOKEN="${CLOUDFLARE_IMAGES_TOKEN:-${CLOUDFLARE_MEDIA_API_TOKEN:-$CLOUDFLARE_API_TOKEN}}"
          STREAM_TOKEN="${CLOUDFLARE_STREAM_TOKEN:-${CLOUDFLARE_MEDIA_API_TOKEN:-$CLOUDFLARE_API_TOKEN}}"
          if [ -z "$IMAGES_TOKEN" ] || [ -z "$STREAM_TOKEN" ]; then
            echo "Cloudflare media token is not configured."
            exit 1
          fi
          printf '%s' "$IMAGES_TOKEN" | npx wrangler secret put CLOUDFLARE_IMAGES_TOKEN --env production
          printf '%s' "$STREAM_TOKEN" | npx wrangler secret put CLOUDFLARE_STREAM_TOKEN --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MEDIA_API_TOKEN: ${{ secrets.CLOUDFLARE_MEDIA_API_TOKEN }}
          CLOUDFLARE_IMAGES_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_TOKEN }}
          CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}

      - name: Sync Mapbox runtime secret
        working-directory: ./backend-cf
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAPBOX_ACCESS_TOKEN:-}" ]; then
            echo "MAPBOX_ACCESS_TOKEN is not configured; broad city/country labels will be unavailable."
            exit 0
          fi
          printf '%s' "$MAPBOX_ACCESS_TOKEN" | npx wrangler secret put MAPBOX_ACCESS_TOKEN --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}

      - name: Ensure media moderation queue exists
        working-directory: ./backend-cf
        run: npx wrangler queues create captro-media-moderation || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Skip legacy D1 migrations
        run: echo "Supabase Postgres is Captro's production database; D1 migrations are legacy-only and are not replayed during normal deploys."

      - name: Deploy to Cloudflare Workers
        working-directory: ./backend-cf
        run: npx wrangler deploy --env production --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production OAuth routes and runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "https://api.flames-up.com/api"

          def json_request(path, body=None):
              request = urllib.request.Request(
                  f"{base}{path}",
                  method="POST" if body is not None else "GET",
                  headers={
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "Captro-Release-Smoke/1.0",
                  },
                  data=json.dumps(body).encode() if body is not None else None,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      payload = json.load(error)
                  except Exception:
                      payload = {}
                  return error.code, payload

          status, config = json_request("/auth/oauth/config")
          if status != 200:
              raise SystemExit(f"OAuth runtime config returned HTTP {status}")
          checks = {
              "Google audience": config.get("google", {}).get("backend_configured") is True,
              "Apple audience": config.get("apple", {}).get("audience_configured") is True,
              "OAuth session bridge": config.get("session_bridge", {}).get("configured") is True,
              "Supabase session dependencies": config.get("session_bridge", {}).get("supabase_configured") is True,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Production OAuth runtime is incomplete: " + ", ".join(failed))

          probes = (
              ("google", {"id_token": "invalid"}, "GOOGLE_PROVIDER_CREDENTIAL_INVALID"),
              ("apple", {"id_token": "invalid", "nonce": "invalid"}, "APPLE_PROVIDER_CREDENTIAL_INVALID"),
          )
          for provider, body, expected_code in probes:
              probe_status, payload = json_request(f"/auth/oauth/{provider}", body)
              if probe_status != 401 or payload.get("code") != expected_code:
                  raise SystemExit(
                      f"Production {provider} route failed before provider validation: "
                      f"HTTP {probe_status}, code={payload.get('code', 'missing')}"
                  )
          print("Production Apple and Google routes reach provider validation; OAuth runtime dependencies are configured.")
          PY
