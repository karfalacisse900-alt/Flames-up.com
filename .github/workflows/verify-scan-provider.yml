name: Verify Captro scan provider
on:
  workflow_dispatch:
    inputs:
      production:
        type: boolean
        default: false
        description: 'Exercise the deployed API, real storage, and database with a temporary test account'
      direct_worker:
        type: boolean
        default: false
        description: 'Diagnose the production Worker separately from custom-domain edge rules'
      inspect_edge:
        type: boolean
        default: false
        description: 'Read API-domain challenge settings without modifying Cloudflare security'
      status_diagnostic:
        type: boolean
        default: false
        description: 'Diagnose private text Status publication with a temporary test account'
      status_photo_diagnostic:
        type: boolean
        default: false
        description: 'Test private photo Status upload and publication, then clean up'
      status_video_diagnostic:
        type: boolean
        default: false
        description: 'Test private Stream video Status upload and publication, then clean up'
      chat_realtime_diagnostic:
        type: boolean
        default: false
        description: 'Measure authorized two-client chat Realtime delivery and RLS isolation'
      workers_ai_diagnostic:
        type: boolean
        default: false
        description: 'Test the Cloudflare safety model using synthetic text only'
  push:
    branches: [fix/oauth-guest-access]
    paths: ['.github/workflows/verify-scan-provider.yml', 'backend-cf/scripts/verify-scan-provider.mjs']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cf/package-lock.json
      - run: npm ci
        working-directory: backend-cf
      - name: Inspect API edge challenge configuration
        if: ${{ inputs.inspect_edge == true && inputs.workers_ai_diagnostic != true && inputs.status_photo_diagnostic != true && inputs.status_video_diagnostic != true && inputs.chat_realtime_diagnostic != true }}
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/inspect-scan-edge.mjs
      - name: Check private storage and real Veryfi processing
        if: ${{ inputs.production != true && inputs.inspect_edge != true && inputs.status_diagnostic != true && inputs.status_photo_diagnostic != true && inputs.status_video_diagnostic != true && inputs.chat_realtime_diagnostic != true && inputs.workers_ai_diagnostic != true }}
        working-directory: backend-cf
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERYFI_CLIENT_ID: ${{ secrets.VERYFI_CLIENT_ID }}
          VERYFI_CLIENT_SECRET: ${{ secrets.VERYFI_CLIENT_SECRET }}
          VERYFI_USERNAME: ${{ secrets.VERYFI_USERNAME }}
          VERYFI_API_KEY: ${{ secrets.VERYFI_API_KEY }}
        run: node --experimental-strip-types scripts/verify-scan-provider.mjs
      - name: Verify deployed scan pipeline
        if: ${{ inputs.production == true && inputs.inspect_edge != true && inputs.status_diagnostic != true && inputs.status_photo_diagnostic != true && inputs.status_video_diagnostic != true && inputs.chat_realtime_diagnostic != true && inputs.workers_ai_diagnostic != true }}
        working-directory: backend-cf
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CAPTRO_SCAN_SMOKE_BASE_URL: ${{ inputs.direct_worker && 'https://flames-up-api.karfalacisse900.workers.dev/api' || 'https://api.flames-up.com/api' }}
        run: node scripts/verify-scan-production.mjs
      - name: Diagnose private Status publication
        if: ${{ inputs.status_diagnostic == true && inputs.status_photo_diagnostic != true && inputs.status_video_diagnostic != true && inputs.chat_realtime_diagnostic != true && inputs.workers_ai_diagnostic != true }}
        working-directory: backend-cf
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/diagnose-status-production.mjs
      - name: Diagnose private photo Status publication
        if: ${{ inputs.status_photo_diagnostic == true }}
        working-directory: backend-cf
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MEDIA_API_TOKEN: ${{ secrets.CLOUDFLARE_MEDIA_API_TOKEN }}
          CLOUDFLARE_IMAGES_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/diagnose-status-photo-production.mjs
      - name: Diagnose private video Status publication
        if: ${{ inputs.status_video_diagnostic == true }}
        working-directory: backend-cf
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MEDIA_API_TOKEN: ${{ secrets.CLOUDFLARE_MEDIA_API_TOKEN }}
          CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          node scripts/diagnose-status-video-production.mjs
      - name: Diagnose Cloudflare Workers AI model
        if: ${{ inputs.workers_ai_diagnostic == true && inputs.chat_realtime_diagnostic != true }}
        working-directory: backend-cf
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/diagnose-workers-ai.mjs
      - name: Measure authorized chat Realtime delivery
        if: ${{ inputs.chat_realtime_diagnostic == true }}
        working-directory: backend-cf
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/diagnose-chat-realtime-production.mjs
