name: Supabase Postgres Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: 'Type MIGRATE_SUPABASE_PRODUCTION to apply committed migrations to the linked Supabase project.'
        required: true
        type: string
      include_older_pending_support:
        description: 'Apply the reviewed 20261019234129 Support base migration before the already-live 20261021224216 migration. The workflow verifies the exact pending set.'
        required: false
        type: boolean
        default: false

jobs:
  push-supabase-migrations:
    name: Push Captro Supabase Postgres migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Confirm guarded production migration
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_production_migration }}" != "MIGRATE_SUPABASE_PRODUCTION" ]; then
            echo "Refusing to run. Type MIGRATE_SUPABASE_PRODUCTION in the workflow input."
            exit 1
          fi

      - name: Check required Supabase secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is required."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "SUPABASE_PROJECT_REF is required."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.106.0

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration status before push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.include_older_pending_support }}" = "true" ]; then
            pending="$(supabase migration list | awk -F '|' '
              $1 ~ /^[[:space:]]*[0-9]+[[:space:]]*$/ {
                local_version=$1; remote_version=$2
                gsub(/[[:space:]]/, "", local_version)
                gsub(/[[:space:]]/, "", remote_version)
                if (remote_version == "") print local_version
              }' | sort)"
            expected="$(printf '%s\n' 20261019234129 20261026230000 20261026232009 | sort)"
            if [ "$pending" != "$expected" ]; then
              echo "Refusing --include-all: the pending migration set differs from the reviewed Support bundle."
              printf '%s\n' "$pending"
              exit 1
            fi
            supabase db push --include-all
          else
            supabase db push
          fi

      - name: Show migration status after push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list
