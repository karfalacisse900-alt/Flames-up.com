name: Coordinated Captro reliability release
on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      worker_only:
        type: boolean
        default: false
concurrency:
  group: captro-production-reliability
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: captro-payments-live
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: v2.106.0
      - run: npm ci
        working-directory: backend-cf
      - run: npx tsc --noEmit && npm test
        working-directory: backend-cf
      - name: Verify deployed baseline and existing security boundary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node backend-cf/scripts/verify-reliability-baseline.mjs
          node scripts/app-store/verify-security-schema.mjs
      - name: Verify exact migration scope without applying it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --include-all --dry-run > "$RUNNER_TEMP/captro-pending.txt" 2>&1 || { cat "$RUNNER_TEMP/captro-pending.txt"; exit 1; }
          cat "$RUNNER_TEMP/captro-pending.txt"
          node backend-cf/scripts/verify-reliability-migrations.mjs "$RUNNER_TEMP/captro-pending.txt"
      - name: Build deployable artifact
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --dry-run --outdir "$RUNNER_TEMP/captro-reliability-bundle"
      - name: Pause new sales with the matching Worker
        if: ${{ inputs.deploy }}
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --keep-vars --var CAPTRO_RELIABILITY_ROLLOUT:maintenance --var CAPTRO_ACCOUNT_CLEANUP_MANIFEST:blocked --var CAPTRO_PAYMENT_RECOVERY_ACTIONS:blocked
      - name: Apply the tested allowlisted migrations
        if: ${{ inputs.deploy && !inputs.worker_only }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db push --linked --include-all --yes
      - name: Verify new schema and server-only access before reopening
        if: ${{ inputs.deploy }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node scripts/app-store/verify-security-schema.mjs
          node backend-cf/scripts/verify-reliability-schema.mjs
      - name: Enable verified API without changing payment keys or webhooks
        if: ${{ inputs.deploy }}
        working-directory: backend-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --keep-vars --var CAPTRO_RELIABILITY_ROLLOUT:ready --var CAPTRO_ACCOUNT_CLEANUP_MANIFEST:blocked --var CAPTRO_PAYMENT_RECOVERY_ACTIONS:blocked
      - name: Verify public feed and anonymous denial without customer mutations
        if: ${{ inputs.deploy }}
        run: |
          node backend-cf/scripts/verify-feed-pagination.mjs
          node backend-cf/scripts/verify-reliability-http.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinated-reliability-source
          path: |
            backend-cf/src
            supabase/migrations/202610*.sql
            ${{ runner.temp }}/captro-pending.txt
