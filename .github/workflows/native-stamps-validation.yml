name: Validate Captro Stamps
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Capture identical public stamp examples from TestFlight 563.1
        type: boolean
        default: false
      stream_only:
        description: Verify continuous gestures and record public posts without repeating the passed ratio suite
        type: boolean
        default: false
      cover_runtime:
        description: Publish private Cover examples from the native app with a disposable account and licensed inputs
        type: boolean
        default: false
      cleanup_user_id:
        description: Clean only one exact disposable Cover test account after an interrupted cleanup
        type: string
        default: ''
  push:
    branches: [feature/recorded-voice-moderation]
    paths:
      - 'ios_native/MIRA/**'
      - '.github/workflows/native-stamps-validation.yml'
permissions:
  contents: read
jobs:
  stamps:
    if: ${{ inputs.cleanup_user_id == '' }}
    runs-on: macos-26
    environment: captro-payments-live
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseline == true && 'a1999dc0492d0d785ebc8d7e3deb3c056ccb58e6' || github.sha }}
      - name: Use the same screenshot driver for the baseline
        if: ${{ inputs.baseline }}
        run: |
          git fetch origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- ios_native/MIRA/LayoutUITests/StampRefinementTests.swift
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: ios_native/MIRA
      - name: Native stamp and continuous Home feed tests
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          tests=(-only-testing:CaptroStampTests -only-testing:CaptroPostMediaTests -only-testing:CaptroLayoutUITests/CoverTests/testCoverSelectorOpensRealPhotoPicker -only-testing:CaptroLayoutUITests/EditorialMenuTests -only-testing:CaptroLayoutUITests/ComposerCreationTests/testEmptyFilledKeyboardAndIntentPreservation -only-testing:CaptroLayoutUITests/ComposerCreationTests/testCompactSelectorsAndDirectTimeEditorPreserveDraft -only-testing:CaptroLayoutUITests/MediaWritingTests -only-testing:CaptroLayoutUITests/StampRefinementTests/testContentBudgetsAndUsefulMetadata -only-testing:CaptroLayoutUITests/StampRefinementTests/testLargeTextStampAndShortCaption -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testEveryPhotoRatioFillsScreenWidth -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testVideoFillsScreenWidth -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testTextOnlyAndAccessibilityDoNotReserveMediaHeight)
          if [ '${{ inputs.baseline }}' = 'true' ]; then
            tests=(-only-testing:CaptroLayoutUITests/StampRefinementTests/testBeforePublicStampExamples)
          elif [ '${{ inputs.stream_only }}' = 'true' ]; then
            tests=(-only-testing:CaptroLayoutUITests/HomeFullBleedTests/testContinuousStreamRecording)
          elif [ '${{ inputs.cover_runtime }}' = 'true' ]; then
            # One focused run verifies the restored distinct media ratios,
            # active Cover route, then real private publish/persistence below.
            tests=(-only-testing:CaptroStampTests -only-testing:CaptroLayoutUITests/CoverTests/testCoverSelectorOpensRealPhotoPicker -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testEveryPhotoRatioFillsScreenWidth -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testVideoFillsScreenWidth -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testTextOnlyAndAccessibilityDoNotReserveMediaHeight)
          fi
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/StampBuild" -resultBundlePath "$RUNNER_TEMP/Stamps.xcresult" \
            "${tests[@]}" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/stamp-build.log"
      - name: Record continuous Home scrolling
        if: ${{ !inputs.baseline && !inputs.cover_runtime }}
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == "iPhone 17"))')
          xcrun simctl bootstatus "$device" -b
          xcrun simctl io "$device" recordVideo --codec=h264 "$RUNNER_TEMP/home-continuous-stream.mp4" > "$RUNNER_TEMP/home-recording.log" 2>&1 &
          capture_pid=$!
          trap 'kill -INT "$capture_pid" 2>/dev/null || true; wait "$capture_pid" || true' EXIT
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/StampBuild" -resultBundlePath "$RUNNER_TEMP/StreamRecording.xcresult" \
            -only-testing:CaptroLayoutUITests/StampRefinementTests/testPublicStampExamples \
            -only-testing:CaptroLayoutUITests/StampRefinementTests/testLegacyCaptionIsBoundedWithoutMoreAndVideoControlsRemainUsable \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$RUNNER_TEMP/home-recording-test.log"
      - uses: actions/setup-node@v6
        if: ${{ inputs.cover_runtime }}
        with:
          node-version: '22'
      - name: Prepare isolated private Cover runtime inputs
        if: ${{ inputs.cover_runtime }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # xcodebuild may shut down its test simulator when the prior phase
          # exits; explicitly boot and reinstall the already-built app.
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == "iPhone 17"))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/StampBuild/Build/Products/Debug-iphonesimulator/Captro.app"
          documents="$(xcrun simctl get_app_container "$device" com.captro.app data)/Documents"
          echo "COVER_SIMULATOR=$device" >> "$GITHUB_ENV"
          COVER_TEST_FOLDER="$RUNNER_TEMP/cover-private" COVER_SIM_DOCUMENTS="$documents" node backend-cf/scripts/verify-cover-runtime.mjs prepare
          # A real video input from licensed test photography, not fake playback.
          brew install ffmpeg
          ffmpeg -y -loop 1 -i "$RUNNER_TEMP/cover-private/nightlife.jpg" -t 4 -vf 'scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280' -c:v libx264 -pix_fmt yuv420p "$documents/video.mp4"
          xcrun simctl addmedia "$device" "$RUNNER_TEMP/cover-private/fashion.jpg" "$RUNNER_TEMP/cover-private/dining.jpg"
      - name: Record real Cover editing and private publishing
        if: ${{ inputs.cover_runtime }}
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          xcrun simctl io "$COVER_SIMULATOR" recordVideo --codec=h264 "$RUNNER_TEMP/cover-create-publish.mp4" > "$RUNNER_TEMP/cover-recording.log" 2>&1 &
          capture_pid=$!
          trap 'kill -INT "$capture_pid" 2>/dev/null || true; wait "$capture_pid" || true' EXIT
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$COVER_SIMULATOR" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/StampBuild" -resultBundlePath "$RUNNER_TEMP/CoverRuntime.xcresult" \
            -only-testing:CaptroLayoutUITests/CoverTests/testRealPrivateCoverPublishing \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$RUNNER_TEMP/cover-runtime-test.log"
      - name: Verify persisted native Cover records
        if: ${{ inputs.cover_runtime }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          COVER_TEST_FOLDER: ${{ runner.temp }}/cover-private
        run: node backend-cf/scripts/verify-cover-runtime.mjs verify
      - name: Remove only disposable Cover data and provider media
        if: ${{ always() && inputs.cover_runtime }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGES_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_TOKEN }}
          CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
          COVER_TEST_FOLDER: ${{ runner.temp }}/cover-private
        run: |
          if [ -f "$COVER_TEST_FOLDER/cover-session.json" ]; then
            node backend-cf/scripts/verify-cover-runtime.mjs cleanup
          fi
      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Stamps.xcresult" --output-path "$RUNNER_TEMP/stamp-screenshots"
          if [ -d "$RUNNER_TEMP/StreamRecording.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/StreamRecording.xcresult" --output-path "$RUNNER_TEMP/recording-screenshots"
          fi
          if [ -d "$RUNNER_TEMP/CoverRuntime.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/CoverRuntime.xcresult" --output-path "$RUNNER_TEMP/cover-screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captro-stamp-validation
          path: |
            ${{ runner.temp }}/stamp-build.log
            ${{ runner.temp }}/stamp-screenshots/
            ${{ runner.temp }}/recording-screenshots/
            ${{ runner.temp }}/home-continuous-stream.mp4
            ${{ runner.temp }}/home-recording-test.log
            ${{ runner.temp }}/cover-screenshots/
            ${{ runner.temp }}/cover-create-publish.mp4
            ${{ runner.temp }}/cover-runtime-test.log
  cleanup-cover-test:
    if: ${{ inputs.cleanup_user_id != '' }}
    runs-on: ubuntu-latest
    environment: captro-payments-live
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Remove one verified disposable Cover test account and its media
        env:
          COVER_CLEANUP_USER_ID: ${{ inputs.cleanup_user_id }}
          COVER_TEST_FOLDER: ${{ runner.temp }}/cover-cleanup
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGES_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_TOKEN }}
          CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
        run: node backend-cf/scripts/verify-cover-runtime.mjs cleanup-user
