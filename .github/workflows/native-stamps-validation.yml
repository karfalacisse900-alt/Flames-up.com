name: Validate Captro Stamps
on:
  workflow_dispatch:
  push:
    branches: [feature/recorded-voice-moderation]
    paths:
      - 'ios_native/MIRA/**'
      - '.github/workflows/native-stamps-validation.yml'
permissions:
  contents: read
jobs:
  stamps:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: ios_native/MIRA
      - name: Native stamp and Home paging tests
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/StampBuild" -resultBundlePath "$RUNNER_TEMP/Stamps.xcresult" \
            -only-testing:CaptroStampTests -only-testing:CaptroLayoutUITests/StampVisualTests \
            -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testHomePagerRepeatedSwipesReversalAndPostOpening \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/stamp-build.log"
      - name: Export screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Stamps.xcresult" --output-path "$RUNNER_TEMP/stamp-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captro-stamp-validation
          path: |
            ${{ runner.temp }}/stamp-build.log
            ${{ runner.temp }}/stamp-screenshots/
