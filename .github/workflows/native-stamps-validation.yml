name: Validate Captro Stamps
on:
  workflow_dispatch:
    inputs:
      vertical_feed:
        description: Measure vertical Home feed, lower carousels and delayed pagination with isolated local fixtures
        type: boolean
        default: false
      vertical_baseline:
        description: Compare unchanged b3bdebf6 source using the same vertical-feed fixture and gestures
        type: boolean
        default: false
      slow_media:
        description: Delayed image transport and very slow gestures; no production traffic
        type: boolean
        default: false
      camera_carousel:
        description: Validate native camera review and identical Home/Details carousel gestures without publishing
        type: boolean
        default: false
      carousel_baseline:
        description: Instrument released 619.1 source for comparison only
        type: boolean
        default: false
      favorites_review:
        description: Test private Favorites store and real native star/picker/library with isolated fixtures
        type: boolean
        default: false
      presentation_review:
        description: Review media-only creation and native Details/Stories with isolated fixtures; no publishing
        type: boolean
        default: false
      small_review_only:
        description: Run only the smaller-iPhone presentation subset after the main review has passed
        type: boolean
        default: false
      restore_audit:
        description: Instrument real lazy Home restoration without distributing a build
        type: boolean
        default: false
      profile_only:
        description: Build and run only the restoration recording/profile checks (not the full acceptance suite)
        type: boolean
        default: false
      cached_framing:
        description: Verify delayed conflicting Details metadata and navigation scroll anchors
        type: boolean
        default: false
      media_geometry:
        description: Verify shared post framing and 100 mixed posts without unrelated redesign tests
        type: boolean
        default: false
      baseline:
        description: Capture identical public stamp examples from TestFlight 563.1
        type: boolean
        default: false
      stream_only:
        description: Verify continuous gestures and record public posts without repeating the passed ratio suite
        type: boolean
        default: false
      feed_fixes_only:
        description: Verify compact stamps, stable mixed carousels, blank writing, and clean Details media
        type: boolean
        default: false
      stability_layout_retry:
        description: Recheck landscape stamp budget after the complete stability run, with all native unit tests
        type: boolean
        default: false
      cover_runtime:
        description: Publish private Cover examples from the native app with a disposable account and licensed inputs
        type: boolean
        default: false
      cleanup_user_id:
        description: Clean only one exact disposable Cover test account after an interrupted cleanup
        type: string
        default: ''
  push:
    branches: [feature/recorded-voice-moderation]
    paths:
      - 'ios_native/MIRA/**'
      - '.github/workflows/native-stamps-validation.yml'
permissions:
  contents: read
jobs:
  vertical-feed:
    if: ${{ inputs.vertical_feed }}
    uses: ./.github/workflows/native-vertical-feed-validation.yml
    with:
      baseline: ${{ inputs.vertical_baseline }}
      small_phone: ${{ inputs.small_review_only }}
      slow_media: ${{ inputs.slow_media }}
      profile_cpu: ${{ inputs.profile_only }}
  camera-carousel:
    if: ${{ inputs.camera_carousel && !inputs.vertical_feed }}
    uses: ./.github/workflows/native-camera-carousel-validation.yml
    with:
      baseline: ${{ inputs.carousel_baseline }}
      small_phone: ${{ inputs.small_review_only }}
  stamps:
    if: ${{ inputs.cleanup_user_id == '' && !inputs.camera_carousel && !inputs.vertical_feed }}
    runs-on: macos-26
    environment: captro-payments-live
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseline == true && 'a1999dc0492d0d785ebc8d7e3deb3c056ccb58e6' || github.sha }}
      - name: Use the same screenshot driver for the baseline
        if: ${{ inputs.baseline }}
        run: |
          git fetch origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- ios_native/MIRA/LayoutUITests/StampRefinementTests.swift
      - name: Record actual source for release validation
        id: native_source
        if: ${{ !inputs.baseline && !inputs.profile_only && !inputs.stream_only }}
        run: node scripts/app-store/native-validation-source.mjs
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: ios_native/MIRA
      - name: Pin one simulator for validation and recording
        run: |
          # Reproduce the previously failing recording runtime, not one runtime
          # for tests and a different first-listed runtime for recording.
          if [ '${{ inputs.small_review_only }}' = 'true' ]; then
            runtime=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(r for r in json.load(sys.stdin)["devices"] if r.endswith("iOS-26-4")))')
            device=$(xcrun simctl create 'Captro review small' com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini "$runtime")
          else
            device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in ds.items() if runtime.endswith("iOS-26-4") for d in items if d["name"] == "iPhone 17"))')
          fi
          echo "FEED_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcodebuild -version
          xcrun simctl list devices available
      - name: Native stamp and continuous Home feed tests
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          tests=(-only-testing:CaptroStampTests -only-testing:CaptroLayoutUITests/CoverTests/testCoverSelectorOpensRealPhotoPicker -only-testing:CaptroLayoutUITests/EditorialMenuTests -only-testing:CaptroLayoutUITests/ComposerCreationTests -only-testing:CaptroLayoutUITests/VoiceEntryTests -only-testing:CaptroLayoutUITests/MediaWritingTests -only-testing:CaptroLayoutUITests/StampRefinementTests/testContentBudgetsAndUsefulMetadata -only-testing:CaptroLayoutUITests/StampRefinementTests/testLargeTextStampAndShortCaption -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testEveryPhotoRatioFillsScreenWidth -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testVideoFillsScreenWidth -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testTextOnlyAndAccessibilityDoNotReserveMediaHeight)
          if [ '${{ inputs.restore_audit }}' = 'true' ]; then
            tests=(-only-testing:CaptroStampTests
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLazyFeedTabReturnDoesNotIssueScrollCommands
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLazyFeedGestureDirectionsAndBackgroundReturn
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testFortyMixedPostsAndDetailsReturn
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testCachedHomeSurvivesConflictingDelayedDetailsRefresh
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame)
            if [ '${{ inputs.profile_only }}' = 'true' ]; then
              # Full acceptance was already run against these identical app sources.
              # Keep this collector investigation focused instead of replaying it.
              tests=(-only-testing:CaptroStampTests)
            fi
          elif [ '${{ inputs.cached_framing }}' = 'true' ]; then
            tests=(-only-testing:CaptroStampTests
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testCachedHomeSurvivesConflictingDelayedDetailsRefresh
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testEveryPhotoRatioFillsScreenWidth
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame)
          elif [ '${{ inputs.media_geometry }}' = 'true' ]; then
            tests=(-only-testing:CaptroStampTests
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLiveNYPLHomeAndDetailsShareStoredPortraitFrame
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testEveryPhotoRatioFillsScreenWidth
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testHundredMixedPostsAndDetailsReturn
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testIdleBackgroundUpdatesPreserveReadingPositionAndHeader
              -only-testing:CaptroLayoutUITests/MediaWritingTests/testEditorCommitCancelAndIndependentCarouselText
              -only-testing:CaptroLayoutUITests/MediaWritingTests/testPostFramingPreviewCommitAndCancel)
          elif [ '${{ inputs.baseline }}' = 'true' ]; then
            tests=(-only-testing:CaptroLayoutUITests/StampRefinementTests/testBeforePublicStampExamples)
          elif [ '${{ inputs.stream_only }}' = 'true' ]; then
            tests=(-only-testing:CaptroLayoutUITests/HomeFullBleedTests/testContinuousStreamRecording)
          elif [ '${{ inputs.stability_layout_retry }}' = 'true' ]; then
            tests=(-only-testing:CaptroStampTests
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testEveryPhotoRatioFillsScreenWidth
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testVideoFillsScreenWidth)
          elif [ '${{ inputs.feed_fixes_only }}' = 'true' ]; then
            tests=(-only-testing:CaptroStampTests
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testIdleBackgroundUpdatesPreserveReadingPositionAndHeader
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testFortyMixedPostsAndDetailsReturn
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testEveryPhotoRatioFillsScreenWidth
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testVideoFillsScreenWidth
              -only-testing:CaptroLayoutUITests/MediaWritingTests/testEditorCommitCancelAndIndependentCarouselText
              -only-testing:CaptroLayoutUITests/StampRefinementTests/testContentBudgetsAndUsefulMetadata
              -only-testing:CaptroLayoutUITests/StampRefinementTests/testLargeTextStampAndShortCaption)
          elif [ '${{ inputs.cover_runtime }}' = 'true' ]; then
            # One focused run verifies the restored distinct media ratios,
            # active Cover route, then real private publish/persistence below.
            tests=(-only-testing:CaptroStampTests -only-testing:CaptroLayoutUITests/CoverTests/testCoverSelectorOpensRealPhotoPicker -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testEveryPhotoRatioFillsScreenWidth -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testVideoFillsScreenWidth -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testTextOnlyAndAccessibilityDoNotReserveMediaHeight)
          fi
          if [ '${{ inputs.presentation_review }}' = 'true' ] || [ '${{ inputs.favorites_review }}' = 'true' ]; then
            tests=(-only-testing:CaptroStampTests
              -only-testing:CaptroLayoutUITests/PostPresentationReviewTests
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLazyFeedTabReturnDoesNotIssueScrollCommands
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLazyFeedGestureDirectionsAndBackgroundReturn
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame)
            if [ '${{ inputs.small_review_only }}' = 'true' ]; then
              tests=(-only-testing:CaptroStampTests
                -only-testing:CaptroLayoutUITests/PostPresentationReviewTests/testComposerRequiresMediaAndHasNoResponses
                -only-testing:CaptroLayoutUITests/ComposerCreationTests
                -only-testing:CaptroLayoutUITests/VoiceEntryTests
                  -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLazyFeedTabReturnDoesNotIssueScrollCommands
                  -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame
                -only-testing:CaptroLayoutUITests/PostPresentationReviewTests/testOrdinaryDetailsHasCaptionAndNoPollOrTransaction
                -only-testing:CaptroLayoutUITests/PostPresentationReviewTests/testLargeTextStoryAndDetails)
            fi
            if [ '${{ inputs.favorites_review }}' = 'true' ]; then
              tests=(-only-testing:CaptroStampTests -only-testing:CaptroLayoutUITests/FavoritesTests
                -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLazyFeedTabReturnDoesNotIssueScrollCommands
                -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame)
            fi
            xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
              -destination "platform=iOS Simulator,id=$FEED_SIMULATOR" \
              -derivedDataPath "$RUNNER_TEMP/StampBuild" CODE_SIGNING_ALLOWED=NO build-for-testing \
              2>&1 | tee "$RUNNER_TEMP/stamp-build.log"
            xcrun simctl install "$FEED_SIMULATOR" "$RUNNER_TEMP/StampBuild/Build/Products/Debug-iphonesimulator/Captro.app"
            container=$(xcrun simctl get_app_container "$FEED_SIMULATOR" com.captro.app data)
            mkdir -p "$container/Documents"
            # Same licensed photograph used by the existing review fixtures.
            curl --fail --retry 2 --max-time 60 \
              'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=max&w=900&q=85&fm=jpg' \
              -o "$container/Documents/presentation-photo.jpg"
          fi
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$FEED_SIMULATOR" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/StampBuild" -resultBundlePath "$RUNNER_TEMP/Stamps.xcresult" \
            "${tests[@]}" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/stamp-build.log"
      - name: Review smaller iPhone layout
        if: ${{ inputs.presentation_review && !inputs.small_review_only }}
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          runtime=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(r for r in json.load(sys.stdin)["devices"] if r.endswith("iOS-26-4")))')
          small=$(xcrun simctl create 'Captro review small' com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini "$runtime")
          source=$(xcrun simctl get_app_container "$FEED_SIMULATOR" com.captro.app data)
          cp "$source/Documents/presentation-photo.jpg" "$RUNNER_TEMP/presentation-photo.jpg"
          xcrun simctl shutdown "$FEED_SIMULATOR"
          xcrun simctl boot "$small"
          xcrun simctl bootstatus "$small" -b
          xcrun simctl install "$small" "$RUNNER_TEMP/StampBuild/Build/Products/Debug-iphonesimulator/Captro.app"
          target=$(xcrun simctl get_app_container "$small" com.captro.app data)
          mkdir -p "$target/Documents"
          cp "$RUNNER_TEMP/presentation-photo.jpg" "$target/Documents/presentation-photo.jpg"
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$small" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/StampBuild" -resultBundlePath "$RUNNER_TEMP/SmallReview.xcresult" \
            -only-testing:CaptroLayoutUITests/PostPresentationReviewTests/testComposerRequiresMediaAndHasNoResponses \
            -only-testing:CaptroLayoutUITests/PostPresentationReviewTests/testOrdinaryDetailsHasCaptionAndNoPollOrTransaction \
            -only-testing:CaptroLayoutUITests/PostPresentationReviewTests/testLargeTextStoryAndDetails \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$RUNNER_TEMP/small-review.log"
      - name: Record continuous Home scrolling
        if: ${{ !inputs.baseline && !inputs.cover_runtime && !inputs.presentation_review && !inputs.favorites_review }}
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          device="$FEED_SIMULATOR"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl terminate "$device" com.captro.app || true
          xcrun simctl io "$device" recordVideo --codec=h264 "$RUNNER_TEMP/home-continuous-stream.mp4" > "$RUNNER_TEMP/home-recording.log" 2>&1 &
          capture_pid=$!
          profiler_pid=''
          finish_capture() {
            kill -INT "$capture_pid" 2>/dev/null || true
            wait "$capture_pid" || true
            if [ -n "$profiler_pid" ]; then wait "$profiler_pid" || true; fi
          }
          trap finish_capture EXIT
          if [ '${{ inputs.restore_audit }}' = 'true' ]; then
            # Best-effort Instruments capture, separate from pass/fail assertions.
            # Preserve errors instead of presenting an unavailable trace as evidence.
            (
              xcrun xctrace list templates > "$RUNNER_TEMP/feed-profiler-templates.log" 2>&1 || true
              xcrun xctrace list devices > "$RUNNER_TEMP/feed-profiler-devices.log" 2>&1 || true
              echo 'Collector started; waiting for Captro.' > "$RUNNER_TEMP/feed-profiler.log"
              captured=false
              for attempt in $(seq 1 300); do
                # An absent process is expected while XCTest starts. Without this
                # guard Actions' bash -e/pipefail exits before the second attempt.
                app_pid=$(pgrep -x Captro | head -1 || true)
                if [ -n "$app_pid" ]; then
                  echo "Attaching to Captro PID $app_pid on simulator $device after discovery attempt $attempt." >> "$RUNNER_TEMP/feed-profiler.log"
                  # A simulator PID is not a process in the default local-Mac
                  # recording target. Use the same explicitly selected device.
                  xcrun xctrace record --device "$device" --template 'Time Profiler' --attach "$app_pid" \
                    --time-limit 45s --output "$RUNNER_TEMP/FeedScroll.trace" >> "$RUNNER_TEMP/feed-profiler.log" 2>&1 || true
                  if [ -d "$RUNNER_TEMP/FeedScroll.trace" ]; then
                    captured=true
                    xcrun xctrace export --input "$RUNNER_TEMP/FeedScroll.trace" --toc \
                      --output "$RUNNER_TEMP/feed-profiler-toc.xml" >> "$RUNNER_TEMP/feed-profiler.log" 2>&1 || true
                    xcrun xctrace export --input "$RUNNER_TEMP/FeedScroll.trace" \
                      --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' \
                      --output "$RUNNER_TEMP/feed-profiler-samples.xml" >> "$RUNNER_TEMP/feed-profiler.log" 2>&1 || true
                  fi
                  break
                fi
                sleep 1
              done
              if [ "$captured" != true ]; then
                echo 'Instruments capture unavailable: no trace produced; inspect discovery/attach output above.' >> "$RUNNER_TEMP/feed-profiler.log"
                echo '::warning::No Captro CPU trace was collected; do not treat the run as profiled.'
              fi
            ) &
            profiler_pid=$!
          fi
          recording_tests=(-only-testing:CaptroLayoutUITests/StampRefinementTests/testPublicStampExamples
            -only-testing:CaptroLayoutUITests/StampRefinementTests/testLegacyCaptionIsBoundedWithoutMoreAndVideoControlsRemainUsable)
          if [ '${{ inputs.restore_audit }}' = 'true' ]; then
            recording_tests=(-only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLazyFeedTabReturnDoesNotIssueScrollCommands
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testLazyFeedGestureDirectionsAndBackgroundReturn
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame)
          elif [ '${{ inputs.cached_framing }}' = 'true' ]; then
            recording_tests=(-only-testing:CaptroLayoutUITests/HomeFullBleedTests/testCachedHomeSurvivesConflictingDelayedDetailsRefresh
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame)
          elif [ '${{ inputs.media_geometry }}' = 'true' ]; then
            recording_tests=(-only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame
              -only-testing:CaptroLayoutUITests/MediaWritingTests/testPostFramingPreviewCommitAndCancel
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testContinuousStreamRecording)
          elif [ '${{ inputs.stream_only }}' = 'true' ]; then
            recording_tests=(-only-testing:CaptroLayoutUITests/HomeFullBleedTests/testContinuousStreamRecording)
          elif [ '${{ inputs.stability_layout_retry }}' = 'true' ]; then
            recording_tests=(-only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testContinuousStreamRecording)
          elif [ '${{ inputs.feed_fixes_only }}' = 'true' ]; then
            recording_tests=(-only-testing:CaptroLayoutUITests/HomeFullBleedTests/testMixedCarouselKeepsOneFeedFrame
              -only-testing:CaptroLayoutUITests/HomeFullBleedTests/testFortyMixedPostsAndDetailsReturn)
          fi
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/StampBuild" -resultBundlePath "$RUNNER_TEMP/StreamRecording.xcresult" \
            "${recording_tests[@]}" \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$RUNNER_TEMP/home-recording-test.log"
      - uses: actions/setup-node@v6
        if: ${{ inputs.cover_runtime }}
        with:
          node-version: '22'
      - name: Prepare isolated private Cover runtime inputs
        if: ${{ inputs.cover_runtime }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # xcodebuild may shut down its test simulator when the prior phase
          # exits; explicitly boot and reinstall the already-built app.
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == "iPhone 17"))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/StampBuild/Build/Products/Debug-iphonesimulator/Captro.app"
          documents="$(xcrun simctl get_app_container "$device" com.captro.app data)/Documents"
          echo "COVER_SIMULATOR=$device" >> "$GITHUB_ENV"
          COVER_TEST_FOLDER="$RUNNER_TEMP/cover-private" COVER_SIM_DOCUMENTS="$documents" node backend-cf/scripts/verify-cover-runtime.mjs prepare
          # A real video input from licensed test photography, not fake playback.
          brew install ffmpeg
          ffmpeg -y -loop 1 -i "$RUNNER_TEMP/cover-private/nightlife.jpg" -t 4 -vf 'scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280' -c:v libx264 -pix_fmt yuv420p "$documents/video.mp4"
          xcrun simctl addmedia "$device" "$RUNNER_TEMP/cover-private/fashion.jpg" "$RUNNER_TEMP/cover-private/dining.jpg"
      - name: Record real Cover editing and private publishing
        if: ${{ inputs.cover_runtime }}
        working-directory: ios_native/MIRA
        run: |
          set -o pipefail
          xcrun simctl io "$COVER_SIMULATOR" recordVideo --codec=h264 "$RUNNER_TEMP/cover-create-publish.mp4" > "$RUNNER_TEMP/cover-recording.log" 2>&1 &
          capture_pid=$!
          trap 'kill -INT "$capture_pid" 2>/dev/null || true; wait "$capture_pid" || true' EXIT
          xcodebuild -project Captro.xcodeproj -scheme Captro -configuration Debug \
            -destination "platform=iOS Simulator,id=$COVER_SIMULATOR" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/StampBuild" -resultBundlePath "$RUNNER_TEMP/CoverRuntime.xcresult" \
            -only-testing:CaptroLayoutUITests/CoverTests/testRealPrivateCoverPublishing \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee "$RUNNER_TEMP/cover-runtime-test.log"
      - name: Verify persisted native Cover records
        if: ${{ inputs.cover_runtime }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          COVER_TEST_FOLDER: ${{ runner.temp }}/cover-private
        run: node backend-cf/scripts/verify-cover-runtime.mjs verify
      - name: Remove only disposable Cover data and provider media
        if: ${{ always() && inputs.cover_runtime }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGES_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_TOKEN }}
          CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
          COVER_TEST_FOLDER: ${{ runner.temp }}/cover-private
        run: |
          if [ -f "$COVER_TEST_FOLDER/cover-session.json" ]; then
            node backend-cf/scripts/verify-cover-runtime.mjs cleanup
          fi
      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Stamps.xcresult" --output-path "$RUNNER_TEMP/stamp-screenshots"
          if [ -d "$RUNNER_TEMP/SmallReview.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/SmallReview.xcresult" --output-path "$RUNNER_TEMP/small-screenshots"
          fi
          if [ -d "$RUNNER_TEMP/StreamRecording.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/StreamRecording.xcresult" --output-path "$RUNNER_TEMP/recording-screenshots"
          fi
          if [ -d "$RUNNER_TEMP/CoverRuntime.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/CoverRuntime.xcresult" --output-path "$RUNNER_TEMP/cover-screenshots"
          fi
      - name: Attest successful native runtime validation source
        if: ${{ success() && steps.native_source.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-source
          path: ${{ runner.temp }}/native-validation-source/source.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect DEBUG fixture startup timings
        if: always()
        run: |
          container=$(xcrun simctl get_app_container "$FEED_SIMULATOR" com.captro.app data) || exit 0
          if [ -f "$container/Documents/feed-fixture-startup.log" ]; then
            cp "$container/Documents/feed-fixture-startup.log" "$RUNNER_TEMP/feed-fixture-startup.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captro-stamp-validation
          path: |
            ${{ runner.temp }}/stamp-build.log
            ${{ runner.temp }}/stamp-screenshots/
            ${{ runner.temp }}/small-screenshots/
            ${{ runner.temp }}/small-review.log
            ${{ runner.temp }}/recording-screenshots/
            ${{ runner.temp }}/home-continuous-stream.mp4
            ${{ runner.temp }}/home-recording-test.log
            ${{ runner.temp }}/FeedScroll.trace/
            ${{ runner.temp }}/feed-profiler*.log
            ${{ runner.temp }}/feed-profiler-toc.xml
            ${{ runner.temp }}/feed-profiler-samples.xml
            ${{ runner.temp }}/feed-fixture-startup.log
            ${{ runner.temp }}/cover-screenshots/
            ${{ runner.temp }}/cover-create-publish.mp4
            ${{ runner.temp }}/cover-runtime-test.log
  cleanup-cover-test:
    if: ${{ inputs.cleanup_user_id != '' }}
    runs-on: ubuntu-latest
    environment: captro-payments-live
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Remove one verified disposable Cover test account and its media
        env:
          COVER_CLEANUP_USER_ID: ${{ inputs.cleanup_user_id }}
          COVER_TEST_FOLDER: ${{ runner.temp }}/cover-cleanup
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGES_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_TOKEN }}
          CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
        run: node backend-cf/scripts/verify-cover-runtime.mjs cleanup-user
